<style>
  :root {
    color-scheme: light;
    --bg: #f3f5fa; --surface: #ffffff; --surface-2: #f7f8fc; --surface-3: #eef1f8;
    --ink: #0f1a33; --ink-2: #56607e; --muted: #98a0b8; --hair: #e7eaf2; --hair-2: #d8ddea;
    --accent: #3b4dff; --accent-soft: #eceefe; --mae: #0aa896; --mae-soft: #e1f6f3;
    --crit: #e5484d; --crit-soft: #fdecec; --warn: #d9860a; --warn-soft: #fff3de;
    --info: #2f7ef7; --info-soft: #e7f0fe; --good: #149b5f; --good-soft: #e3f5ec;
    --hero: linear-gradient(135deg, #0a1030 0%, #2448d8 55%, #7a45f0 115%);
    --shadow: 0 1px 3px rgba(15,26,51,.06), 0 12px 32px rgba(15,26,51,.08);
    --shadow-sm: 0 1px 3px rgba(15,26,51,.07);
    --radius: 18px;
    --fhero: linear-gradient(140deg, #2f6bff 0%, #5a4dff 55%, #8a4bff 100%);
    --falt: linear-gradient(150deg, #0fc6bb 0%, #2f8bff 100%);
    --hero-glow: rgba(40,60,200,.28);
  }
  /* ---------- temas (escolha no menu; bege é o padrão) ---------- */
  :root, :root[data-theme="bege"] {
    --bg: #f3ede2; --surface: #fffcf6; --surface-2: #faf5ec; --surface-3: #f0e8da;
    --ink: #2a2118; --ink-2: #6b5d4d; --muted: #a3968a; --hair: #ebe2d3; --hair-2: #dccfbb;
    --accent-soft: #ecebfb;
    --shadow: 0 1px 3px rgba(60,40,20,.06), 0 12px 32px rgba(60,40,20,.08);
    --shadow-sm: 0 1px 3px rgba(60,40,20,.07);
  }
  :root[data-theme="branco"] {
    --bg: #f3f5fa; --surface: #ffffff; --surface-2: #f7f8fc; --surface-3: #eef1f8;
    --ink: #0f1a33; --ink-2: #56607e; --muted: #98a0b8; --hair: #e7eaf2; --hair-2: #d8ddea;
    --accent-soft: #eceefe;
    --shadow: 0 1px 3px rgba(15,26,51,.06), 0 12px 32px rgba(15,26,51,.08);
    --shadow-sm: 0 1px 3px rgba(15,26,51,.07);
  }
  :root[data-theme="preto"] {
    color-scheme: dark;
    --bg: #05070d; --surface: #0e121c; --surface-2: #151a26; --surface-3: #1d2331; 
    --ink: #eef1f7; --ink-2: #aab2c5; --muted: #737c92; --hair: #292e39; --hair-2: #363c49;
    --accent: #6f86ff; --accent-soft: #1b2250; --mae: #1fd6c8; --mae-soft: #0d2c2c;
    --hero: linear-gradient(135deg, #070b1f 0%, #1c3fd0 55%, #7a45f0 115%); --hero-glow: rgba(60,80,255,.25);
    --crit: #ff6b70; --crit-soft: #3a1c1f; --warn: #f0a63a; --warn-soft: #3a2c14;
    --info: #5b9dff; --info-soft: #1a2a44; --good: #38c985; --good-soft: #15301f;
    --shadow: 0 1px 3px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.35);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
  }
  :root[data-theme="azul"] {
    --bg: #e9f0fa; --surface: #ffffff; --surface-2: #f3f7fd; --surface-3: #e2ebf7;
    --ink: #0b1f3f; --ink-2: #4a5f82; --muted: #8ea0bd; --hair: #dbe5f2; --hair-2: #c7d5e9;
    --accent: #1463d8; --accent-soft: #e0ecfd;
    --hero: linear-gradient(135deg, #0b2a66 0%, #1463d8 58%, #19b4d8 120%);
    --hero-glow: rgba(11,58,140,.28);
    --fhero: linear-gradient(140deg, #0b3a8c 0%, #1463d8 55%, #2fa8f0 100%);
    --falt: linear-gradient(150deg, #0aa896 0%, #1463d8 100%);
    --shadow: 0 1px 3px rgba(11,31,63,.06), 0 12px 32px rgba(11,31,63,.09);
  }
  :root[data-theme="vermelho"] {
    --bg: #faeeec; --surface: #fffaf9; --surface-2: #fcf3f1; --surface-3: #f5e3e0;
    --ink: #3a0d12; --ink-2: #7d4a50; --muted: #b89499; --hair: #f0dbd8; --hair-2: #e5c6c3;
    --accent: #b8162f; --accent-soft: #fbe2e5; --crit: #e0521b; --crit-soft: #fdebe2;
    --hero: linear-gradient(135deg, #4a0a14 0%, #b8162f 58%, #f08a24 120%);
    --hero-glow: rgba(140,20,40,.28);
    --fhero: linear-gradient(140deg, #7a0f22 0%, #b8162f 55%, #e8465f 100%);
    --falt: linear-gradient(150deg, #d9602a 0%, #b8162f 100%);
    --shadow: 0 1px 3px rgba(58,13,18,.06), 0 12px 32px rgba(58,13,18,.09);
  }
  .theme-pick { display: flex; align-items: center; gap: 7px; padding: 4px 10px; }
  .theme-pick .tl-l { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  .theme-pick button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hair-2); cursor: pointer; padding: 0; flex-shrink: 0; transition: transform .15s, box-shadow .15s; }
  .theme-pick button:hover { transform: scale(1.12); }
  .theme-pick button.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  @media (max-width: 900px) { .theme-pick { padding: 0 4px; } .theme-pick .tl-l { display: none; } }
  body { transition: background-color .3s, color .3s; }
  /* tema fixo no topo (celular) */
  .theme-fab, .theme-pop { display: none; }
  @media (max-width: 900px) {
    .side .theme-pick { display: none; }
    .side { padding-right: 62px; }
    .theme-fab { display: block; position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 40; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--hair-2), var(--shadow-sm); cursor: pointer; padding: 0; }
    .theme-pop.open { display: flex; position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 41; flex-direction: column; gap: 2px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; min-width: 170px; }
    .theme-pop button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; text-align: left; }
    .theme-pop button.on { background: var(--accent-soft); color: var(--accent); }
    .theme-pop i { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--hair-2); flex-shrink: 0; }
  }
  /* demonstração x dados reais */
  .demo-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); background: var(--warn-soft); border: 1px dashed var(--warn); border-radius: 12px; padding: 8px 12px; }
  .demo-bar b { color: var(--warn); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
  .demo-bar button { border: 0; background: transparent; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; font-size: 12.5px; margin-left: auto; }
  .demo-pill { display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 2px 8px; margin-top: 3px; }
  /* herói: observação → evidência → impacto → próxima ação */
  .hero .risk { font-size: 14px; opacity: .95; margin: -4px 0 12px; }
  .hero .hstep { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin: 4px 0 6px; }
  .hero .evchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .hero .evchips span { font-size: 11.5px; font-weight: 700; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; }
  /* sinais: por quê, impacto e o que fazer */
  .sig .sfz { font-size: 12px; color: var(--mae); font-weight: 700; margin-top: 3px; }
  .sig .go { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .sig .simp { font-size: 13px; color: var(--ink); font-weight: 800; }
  @media (max-width: 600px) { .sig { grid-template-columns: 4px 1fr; } .sig .go { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; } .sig .simp small { display: inline; margin-left: 4px; } }
  @media (max-width: 900px) { .brand .demo-pill { display: none; } }
  .sig .simp small { font-size: 10.5px; color: var(--muted); font-weight: 700; display: block; text-align: right; }
  table.today .tsrc { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  /* cadeia de raciocínio */
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
  .flow .fs { background: var(--surface-2); border: 1px solid var(--hair); border-radius: 12px; padding: 9px 11px; min-width: 120px; flex: 1 1 130px; text-align: left; font: inherit; color: inherit; }
  .flow button.fs { cursor: pointer; } .flow button.fs:hover { border-color: var(--accent); }
  .flow .fs .fl { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .flow .fs .fv { font-size: 12.5px; font-weight: 700; margin-top: 3px; line-height: 1.35; }
  .flow .fs.hl { background: var(--mae-soft); border-color: transparent; } .flow .fs.hl .fl { color: var(--mae); }
  .flow .fs.wait { background: var(--warn-soft); border-color: transparent; } .flow .fs.wait .fl { color: var(--warn); }
  .flow .ar { align-self: center; color: var(--muted); font-weight: 800; }
  @media (max-width: 600px) { .flow .ar { display: none; } .flow .fs { flex-basis: 45%; } }
  .cycle span.done { background: var(--good-soft); color: var(--good); }
  .chain { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--hair); border-radius: 14px; padding: 12px; }
  .chain .cl { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .chain .ci { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13.5px; font-weight: 700; }
  .chain .rec { border: 0; padding: 0; }
  /* dados & integrações */
  .know { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  @media (max-width: 960px) { .know { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 480px) { .know { grid-template-columns: repeat(2, 1fr); } }
  .know .k { background: var(--surface-2); border-radius: 14px; padding: 12px; }
  .know .kv { font-size: 22px; font-weight: 800; letter-spacing: -.02em; } .know .kl { font-size: 12px; color: var(--ink-2); } .know .ks { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .modes { grid-template-columns: 1fr; } }
  .modes > div { border-radius: 14px; padding: 13px 14px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
  .modes .md { background: var(--warn-soft); } .modes .mr { background: var(--good-soft); }
  .modes h3 { margin: 0 0 6px; font-size: 13.5px; color: var(--ink); }
  .modes ul { margin: 0; padding-left: 18px; }
  .synclist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .synclist div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--ink-2); }
  .synclist b { display: block; color: var(--ink); font-size: 13px; }
  /* company dna */
  .dna { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  @media (max-width: 420px) { .dna { grid-template-columns: 1fr; } }
  .trait { text-align: left; border: 1px solid var(--hair); background: var(--surface); border-radius: 16px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 7px; font: inherit; color: inherit; transition: border-color .15s, transform .15s; }
  .trait:hover { border-color: var(--mae); transform: translateY(-2px); }
  .trait .tt { font-weight: 800; font-size: 14px; line-height: 1.35; }
  .trait .td { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .trait .tb { font-size: 11.5px; color: var(--mae); font-weight: 800; }
  .trait .tf { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: auto; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background-color: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100%; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  /* ---------- menu lateral ---------- */
  .side { background: var(--surface); border-right: 1px solid var(--hair); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 6px; }
  .brand .mark { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
  .brand .lockup { display: flex; align-items: center; gap: 9px; }
  .brand .sym { width: 50px; height: 26px; flex-shrink: 0; display: block; }
  .brand .word { height: 19px; width: auto; display: block; color: var(--ink); }
  .brand .tg2 { font-size: 7.6px; font-weight: 600; letter-spacing: .24em; color: var(--ink-2); white-space: nowrap; }
  .brand .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--hero); color: #fff; font-weight: 900; display: grid; place-items: center; letter-spacing: -.04em; font-size: 15px; flex-shrink: 0; }
  .brand .nm { font-weight: 800; font-size: 16px; letter-spacing: -.02em; }
  .brand .tg { font-size: 11px; color: var(--muted); }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-group .gl { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; text-align: left; color: var(--ink-2); font-weight: 600; font-size: 13.5px; width: 100%; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.on { background: var(--accent-soft); color: var(--accent); }
  .nav-item .ic { width: 18px; text-align: center; flex-shrink: 0; }
  .nav-item .badge { margin-left: auto; background: var(--crit); color: #fff; font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 1px 7px; }
  .nav-item .badge.soft { background: var(--accent); }
  .nav-item[disabled] { opacity: .45; cursor: default; }
  .nav-item[disabled]:hover { background: transparent; color: var(--ink-2); }
  .nav-item .soon { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--muted); }
  .nav-item.ask { background: var(--mae-soft); color: var(--mae); margin: 4px 0; }
  .nav-item.ask.on { background: var(--mae); color: #fff; }
  .side-foot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 8px 10px; line-height: 1.5; }
  .side-foot button { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 0; font-weight: 700; font-size: 11px; }
  @media (max-width: 900px) {
    .side { position: sticky; top: 0; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); gap: 6px; border-right: 0; border-bottom: 1px solid var(--hair); z-index: 30; }
    .brand { padding: 0 6px 0 0; } .brand .tg, .brand .nm, .brand .word, .brand .tg2 { display: none; } .brand .sym { width: 44px; height: 23px; }
    .nav-group { flex-direction: row; gap: 4px; } .nav-group .gl, .side-foot { display: none; }
    .nav-item { white-space: nowrap; width: auto; padding: 8px 10px; }
    .nav-item[disabled] { display: none; }
  }

  /* ---------- área principal ---------- */
  .main { padding-inline: 28px; padding-block: 26px 40px; min-width: 0; }
  @media (max-width: 600px) { .main { padding-inline: 16px; } }
  .view { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .head h1 { font-size: 26px; margin: 0; letter-spacing: -.025em; }
  .head p { margin: 5px 0 0; color: var(--ink-2); font-size: 14px; max-width: 70ch; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mae); margin-bottom: 6px; }

  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
  .card h2 { font-size: 15.5px; margin: 0; letter-spacing: -.01em; }
  .card .cs { font-size: 12.5px; color: var(--muted); margin: 3px 0 14px; }
  .row2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 960px) { .row2 { grid-template-columns: 1fr; } }

  .reveal { opacity: 0; transform: translateY(12px); }
  .reveal.in { animation: pop .5s cubic-bezier(.2,.8,.25,1) forwards; }
  @keyframes pop { to { opacity: 1; transform: none; } }

  /* cobertura */
  .coverage { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .src { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; background: var(--surface); border: 1px solid var(--hair); border-radius: 999px; padding: 5px 11px; color: var(--ink-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.live { background: var(--good); box-shadow: 0 0 0 0 rgba(20,155,95,.5); animation: live 2s infinite; }
  @keyframes live { 70% { box-shadow: 0 0 0 7px rgba(20,155,95,0); } 100% { box-shadow: 0 0 0 0 rgba(20,155,95,0); } }
  .dot.ok { background: var(--good); } .dot.stale { background: var(--warn); } .dot.off { background: var(--hair-2); }

  /* sinal principal */
  .hero { background: var(--hero); color: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 18px 40px var(--hero-glow, rgba(29,43,140,.28)); display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events: none; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .hero .lbl { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .8; display: flex; align-items: center; gap: 8px; }
  .hero .ttl { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 8px 0 12px; line-height: 1.2; text-wrap: balance; }
  .hero .why { display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; }
  .hero .why div { display: flex; gap: 9px; align-items: flex-start; opacity: .95; }
  .hero .why .b { width: 18px; height: 18px; border-radius: 6px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 10px; flex-shrink: 0; margin-top: 1px; }
  .hero .side-box { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .hero .imp-l { font-size: 11.5px; opacity: .8; }
  .hero .imp-v { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
  .hero .todo { font-size: 13.5px; line-height: 1.45; }
  .hero .conf { font-size: 11.5px; opacity: .85; }
  .hero .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .btn { border: 0; border-radius: 11px; padding: 9px 14px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform .1s, background .15s, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn.w { background: #fff; color: #0f1a33; } .btn.wg { background: rgba(255,255,255,.14); color: #fff; }
  .btn.p { background: var(--accent); color: #fff; } .btn.p:hover { filter: brightness(.9); }
  .btn.g { background: var(--good); color: #fff; } .btn.r { background: var(--surface-3); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }

const brlFull = v => (v < 0 ? "−R$ " : "R$ ") + num(Math.abs(Math.round(v)));

function spark(vals, color, w = 110, h = 30){
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const x = i => 2 + i / (vals.length - 1) * (w - 4), y = v => h - 3 - (v - mn) / r * (h - 6);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block"><polyline points="${vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="2.6" fill="${color}"/></svg>`;
}
function bars(vals, labels, color, hi){
  const W = 560, H = 160, pl = 50, pb = 22, pt = 14, pw = W - pl - 8, ph = H - pb - pt, mx = Math.max(...vals) * 1.12 || 1, bw = pw / vals.length * .58;
  let s = ""; for (let k = 0; k <= 3; k++) { const gv = mx * k / 3, gy = pt + ph - gv / mx * ph; s += `<line x1="${pl}" x2="${W - 8}" y1="${gy}" y2="${gy}" stroke="var(--hair)"/><text class="ax" x="${pl - 6}" y="${gy + 3}" text-anchor="end">${brl(gv).replace("R$ ", "")}</text>`; }
  vals.forEach((v, i) => { const cx = pl + pw / vals.length * (i + .5), h = v / mx * ph; s += `<rect x="${cx - bw / 2}" y="${pt + ph - h}" width="${bw}" height="${h}" rx="4" fill="${i >= hi ? color : "var(--hair-2)"}"><title>${labels[i]}: ${brlFull(v)}</title></rect><text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

function buildRecs(){

    imp: x.perda, n: 3, msg: `Olá! Aqui é da ${EMPRESA}. Notamos que os pedidos diminuíram nos últimos meses e queremos entender como podemos ajudar. Podemos conversar sobre condições para o próximo pedido?` }));
  const cMaior = A.contratos.slice().sort((a, b) => b.rec[5] - a.rec[5])[0];
  if (cMaior) R.push({ id: "r-ren-" + cMaior.id, tipo: "renovacao", alvo: cMaior.id, sig: "s-contr", t: `Iniciar a renovação do contrato com ${cMaior.nome}`,

  const f = A.reajMulti[0];
  if (f) R.push({ id: "r-cot-" + f.f.id, tipo: "cotacao", alvo: f.f.id, sig: "s-forn", t: `Cotar fornecedor alternativo para ${f.f.cat.toLowerCase()}`,

    imp: f.f.compras * f.alta, n: 2, msg: `Solicitar cotação de ${f.f.cat.toLowerCase()} a 2 fornecedores alternativos com base no volume dos últimos 3 meses.` });
  const op = A.oport.slice().sort((a, b) => (b.valor || 0) - (a.valor || 0))[0];
  if (op) R.push({ id: "r-op-" + op.c.id, tipo: "proposta", alvo: op.c.id, sig: "s-oport", t: `Enviar proposta de volume para ${op.c.nome}`,
    porque: [`em ${dia(op.dt)}: "${op.txt}"`, `cliente cresceu ${pct(op.c.rec[5] / op.c.rec[0] - 1, 0)} em 6 meses`], imp: op.valor, n: 2,
    msg: `Olá! Conseguimos atender o volume extra de laticínios para os eventos de outubro. Segue proposta com preço por volume e entregas programadas.` });
  const p = A.prodQueda[0];
  if (p) R.push({ id: "r-pr-" + p.p.id, tipo: "preco", alvo: p.p.id, sig: "s-prod", t: `Revisar preço e margem do ${p.p.nome}`,

    msg: `Simular redução de 4% no preço do ${p.p.nome} com a margem atual e comparar com o preço citado pelos clientes.` });
  return R;
}

// ações declarativas: data-act="cliente:c1", "evid:s-reduz", "go:clientes", "approve:id", "reject:id", ...
function wire(root){
  root.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", ev => {
    ev.stopPropagation(); const [a, arg] = el.dataset.act.split(":");
    if (a === "go") go(arg);
    else if (a === "cliente") openCliente(arg);
    else if (a === "forn") openFornecedor(arg);
    else if (a === "prod") openProduto(arg);
    else if (a === "evid") openEvidencias(arg);
    else if (a === "rec") openRec(arg);
    else if (a === "approve") approve(arg, el);
    else if (a === "reject") showReject(arg, el);
    else if (a === "execute") execute(arg);
    else if (a === "result") recordResult(arg, el.dataset.res);
    else if (a === "ask") ask(decodeURIComponent(arg));
  }));
}

function perceivedCliente(c){
  const out = []; const base = avg(c.rec.slice(0, 4)), rec = avg(c.rec.slice(4)), v = (rec - base) / base;
  if (v <= -0.15) out.push(`Reduziu compras: média de ago–set ${pct(v, 0)} em relação a abr–jul (${brl(base - rec)}/mês a menos).`);
  if (v >= 0.15) out.push(`Está crescendo: média de ago–set ${pct(v, 0)} em relação a abr–jul.`);
  const pr = c.conv.filter(m => m.tags.includes("preço")).length; if (pr) out.push(`Mencionou preço em ${pr} conversa${pr > 1 ? "s" : ""} recente${pr > 1 ? "s" : ""}.`);
  const co = c.conv.filter(m => m.tags.includes("concorrente")).length; if (co) out.push(`Citou concorrente ${co} vez${co > 1 ? "es" : ""}.`);
  const rc = c.conv.filter(m => m.tags.includes("reclamação")); if (rc.length) out.push(`${rc.length} ${rc.length > 1 ? "reclamações recentes" : "reclamação recente"}${rc.some(m => m.tema === "atraso") ? ", sobre atraso na entrega" : ""}.`);
  const op = c.conv.filter(m => m.tags.includes("oportunidade")); if (op.length) out.push(`Pediu orçamento: potencial de ${brl(sum(op.map(m => m.valor || 0)))}.`);
  if (c.contrato && diasAte(c.contrato) <= 30 && diasAte(c.contrato) >= 0) out.push(`Contrato vence em ${diasAte(c.contrato)} dias (${dia(c.contrato)}).`);
  if (diasDesde(c.ult) > 7 && v < 0) out.push(`Último pedido há ${diasDesde(c.ult)} dias.`);
  return out.length ? out : ["Relacionamento estável: sem variação relevante de compras nem alertas nas conversas."];
}

function evidenceList(sigId){

    A.reduz.forEach(x => ev.push({ i: "📉", t: `${x.c.nome}: ${pct(x.var, 0)}`, d: `média abr–jul ${brl(x.base)} → ago–set ${brl(x.rec)} (${brl(x.perda)}/mês a menos) · planilha de vendas` }));
    A.reduz.flatMap(x => x.c.conv.filter(m => m.tags.some(t => ["preço", "concorrente"].includes(t))).map(m => ({ ...m, c: x.c }))).forEach(m => ev.push({ i: "💬", t: `${m.c.nome} · ${dia(m.dt)}`, d: `"${m.txt}" · WhatsApp` }));
    ev.push({ i: "🧮", t: "Como o impacto foi calculado", d: `Soma, para os ${A.reduz.length} clientes, da diferença entre a média mensal de abr–jul e a de ago–set = ${brl(A.reduzPerda)}/mês. Não inclui margem nem sazonalidade.` });
  } else if (sigId === "s-contr") {
    A.contratos.forEach(c => ev.push({ i: "📄", t: `${c.nome}: vence em ${dia(c.contrato)}`, d: `${diasAte(c.contrato)} dias · compra ${brl(c.rec[5])}/mês · cadastro de clientes` }));
    ev.push({ i: "🧮", t: "Valor em jogo", d: `Receita do mês atual × 12 para os contratos listados = ${brl(A.contratosValor)}/ano.` });
  } else if (sigId === "s-recl") {
    A.recl.forEach(m => ev.push({ i: "💬", t: `${m.c.nome} · ${dia(m.dt)}`, d: `"${m.txt}"` }));
    A.atrasoForn.forEach(f => ev.push({ i: "🚚", t: `${f.nome}: ${f.atrasos} atrasos em 60 dias`, d: "planilha de compras e fornecedores" }));
  } else if (sigId === "s-forn") {
    const r = A.reajMulti[0]; const lb = ["Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set"];
    for (let i = 1; i < 8; i++) if (r.f.preco[i] > r.f.preco[i - 1]) ev.push({ i: "🏷", t: `Reajuste em ${lb[i]}`, d: `índice ${r.f.preco[i - 1]} → ${r.f.preco[i]} (${pct(r.f.preco[i] / r.f.preco[i - 1] - 1, 1)})` });
    ev.push({ i: "📊", t: "Concentração", d: `${Math.round(r.f.part * 100)}% das compras de ${r.f.cat.toLowerCase()}` });
  } else if (sigId === "s-prod") {
    const x = A.prodQueda[0]; ev.push({ i: "📉", t: `${x.p.nome}: ${pct(x.v, 0)}`, d: `setembro ${num(x.p.qtd[5])} un. vs média jun–ago ${num(avg(x.p.qtd.slice(2, 5)))} un.` });
    A.convs.filter(m => m.prod === x.p.id).forEach(m => ev.push({ i: "💬", t: `${m.c.nome} · ${dia(m.dt)}`, d: `"${m.txt}"` }));
  } else if (sigId === "s-marg") {
    const d = FIN[FIN.length - 1], p = FIN[FIN.length - 2];
    ev.push({ i: "📊", t: `Margem bruta ${fpct(p.margemBruta)} → ${fpct(d.margemBruta)}`, d: `faturamento ${brl(p.receita)} → ${brl(d.receita)} · CMV ${brl(p.cmv)} → ${brl(d.cmv)} · planilha de vendas` });
    A.reajRec.forEach(r => ev.push({ i: "🏷", t: `${r.f.nome}: reajuste em setembro`, d: `índice ${r.f.preco[6]} → ${r.f.preco[7]} · ${r.f.cat}` }));

/* ================= CICLO: aprovar → executar → resultado ================= */
function rate(tipo){
  const all = [...HIST, ...ST.results.map(x => ({ tipo: x.tipo, res: x.res }))].filter(h => h.tipo === tipo);
  return all.length ? all.filter(h => h.res === "sucesso").length / all.length : 0;
}
function approve(id, el){
  const r = ST.recs.find(x => x.id === id); const card = el.closest(".rec");
  const done = () => { r.status = "aprovada"; r.aprovadaEm = Date.now(); save(); render(); refreshDrawer(); toast("Aprovada. A ação ficou pronta em Ações, aguardando execução."); };
  if (card && !REDUCE) { card.classList.add("leaving"); setTimeout(done, 320); } else done();
}
function showReject(id, el){

function execute(id){ const r = ST.recs.find(x => x.id === id); r.status = "executada"; save(); render(); refreshDrawer(); toast("Ação registrada como executada (simulado no protótipo)."); }
function recordResult(id, res){

  ST.results.push({ id, tipo: r.tipo, t: r.t, res }); save(); render(); refreshDrawer();
  toast(res === "sucesso" ? "Resultado registrado: deu certo. O Aprendizado foi atualizado." : "Resultado registrado. O Aprendizado foi atualizado.");

/* ================= COMPONENTES ================= */
function recActs(r, mode){
  let acts = "";
  if (mode === "pendente") acts = `<button class="btn g sm" data-act="approve:${r.id}">✓ Aprovar</button><button class="btn r sm" data-act="reject:${r.id}">Rejeitar</button><button class="btn ghost sm" data-act="rec:${r.id}">Detalhes</button>`;
  else if (mode === "aprovada") acts = `<button class="btn p sm" data-act="execute:${r.id}">▶ Executar ação</button><span style="font-size:11.5px;color:var(--muted)">nada é enviado sem este clique</span>`;
  else if (mode === "executada") acts = `<span style="font-size:12px;font-weight:700">Como terminou?</span><button class="btn g sm" data-act="result:${r.id}" data-res="sucesso">Deu certo</button><button class="btn r sm" data-act="result:${r.id}" data-res="recusou">Recusou</button><button class="btn r sm" data-act="result:${r.id}" data-res="sem resposta">Sem resposta</button>`;
  else if (mode === "rejeitada") acts = `<span class="tag">Motivo: ${esc(r.motivo || "—")}</span>`;
  else if (mode === "concluida") acts = `<span class="tag ${r.res === "sucesso" ? "good" : r.res === "recusou" ? "crit" : ""}">Resultado: ${esc(r.res)}</span>`;
  return acts;
}
function recCard(r, mode){
  const c = conf(r.n), acts = recActs(r, mode);
  return `<div class="rec reveal">
    <div class="rh"><span class="tag mae">${TIPO_LBL[r.tipo]}</span><span class="tag ${c.c}">Confiança ${c.l.toLowerCase()}</span></div>
    <div class="rt">${esc(r.t)}</div>
    <ul>${r.porque.slice(0, 3).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    <div class="meta"><span>Impacto <b>${brl(r.imp)}${r.tipo === "renovacao" ? "/ano" : r.tipo === "proposta" ? "" : "/mês"}</b></span><span>Funcionou em <b>${Math.round(rate(r.tipo) * 100)}%</b> das vezes</span></div>
    ${mode === "aprovada" ? `<div class="draft">${esc(r.msg)}</div>` : ""}
    <div class="acts">${acts}</div></div>`;
}
function sigRow(s){
  return `<button class="sig" data-act="evid:${s.id}"><span class="bar sev-${s.sev}"></span>
    <span><div class="st">${esc(s.t)}</div><div class="sd">${esc(s.d)}</div>${s.fazer ? `<div class="sfz">→ ${esc(s.fazer)}</div>` : ""}<div class="src-tag">${s.fontes.map(f => `<span>◦ ${esc(f)}</span>`).join("")}<span class="tag ${conf(s.n).c}" style="margin-left:2px">confiança ${conf(s.n).l.toLowerCase()}</span></div></span>
    <span class="go">${s.imp ? `<span class="simp">${brl(s.imp)}${s.unico ? "" : "/mês"}<small>${s.sev === "good" ? "potencial" : "em jogo"}</small></span>` : ""}evidências ›</span></button>`;

// passo a passo sinal → recomendação → aprovação → ação → resultado
const STAGE = { pendente: 2, rejeitada: 2, aprovada: 3, executada: 4, concluida: 5 };
function cycleSteps(r){
  const st = STAGE[r.status], lbl = ["Insight", "Recomendação", r.status === "rejeitada" ? "Rejeitada" : "Aprovação", "Ação", "Resultado"];
  return `<div class="cycle">${lbl.map((t, i) => `<span class="${i < st ? "done" : i === st ? "hl" : ""}">${i < st ? "✓ " : ""}${t}</span>`).join("→")}</div>`;
}
function chainFor(recs){
  return recs.map(r => { const s = SIGNALS.find(x => x.id === r.sig);
    return `<div class="chain">${cycleSteps(r)}
      ${s ? `<div><div class="cl">Insight</div><div class="ci"><span>${esc(s.t)}</span><button class="btn ghost sm" data-act="evid:${s.id}">Ver evidências ›</button></div></div>` : ""}
      <div><div class="cl">Recomendação</div>${recCard(r, r.status).replace("rec reveal", "rec")}</div></div>`; }).join("");
}
function flow(steps){
  return `<div class="flow">${steps.map((x, i) => `${i ? '<span class="ar">→</span>' : ""}${x.act ? `<button class="fs ${x.c || ""}" data-act="${x.act}">` : `<div class="fs ${x.c || ""}">`}<div class="fl">${x.l}</div><div class="fv">${x.v}</div>${x.act ? "</button>" : "</div>"}`).join("")}</div>`;
}

/* ================= FINANCEIRO · Cockpit do CFO Pro dentro do MAE ================= */
const MES_ABR = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MES_EXT = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
// segmentos de clientes: os últimos 6 meses vêm dos próprios clientes; os 18 anteriores são o histórico da planilha
const FSEGS = [
  { k: "Varejo alimentar",    ids: ["c1", "c6", "c8", "c12"],             g: 0.012, cmv: 0.74, color: "#3b4dff" },
  { k: "Food service",        ids: ["c2", "c3", "c4", "c7", "c9", "c11"], g: 0.010, cmv: 0.66, color: "#0aa896" },
  { k: "Hotelaria & eventos", ids: ["c5", "c10"],                         g: 0.018, cmv: 0.62, color: "#f08a24" },
];
const FIN = (() => {
  const rows = []; let caixa = 412000;
  for (let i = 0; i < 24; i++) {
    const dt = new Date(2024, 9 + i, 1), seg = {};
    FSEGS.forEach((s, n) => {
      const abr = sum(s.ids.map(id => byId(CLIENTES, id).rec[0]));
      const r = i >= 18 ? sum(s.ids.map(id => byId(CLIENTES, id).rec[i - 18])) : Math.round(abr * Math.pow(1 + s.g, i - 18) * (1 + 0.03 * Math.sin(i * 1.3 + n)));
      const rate = s.cmv + (i >= 20 ? 0.004 : 0) + (i >= 23 && n < 2 ? 0.014 : 0); // reajustes de laticínios e azeite em setembro
      seg[s.k] = { r, c: Math.round(r * rate) };
    });
    rows.push({ i, lbl: MES_ABR[dt.getMonth()] + "/" + String(dt.getFullYear()).slice(2), ext: MES_EXT[dt.getMonth()] + " de " + dt.getFullYear(), seg });
  }
  rows.forEach((r, i) => {
    r.bseg = {};
    FSEGS.forEach(s => { const br = i >= 12 ? Math.round(rows[i - 12].seg[s.k].r * 1.08) : Math.round(r.seg[s.k].r * 1.02); r.bseg[s.k] = { r: br, c: Math.round(br * s.cmv) }; });
    r.receita = sum(FSEGS.map(s => r.seg[s.k].r)); r.cmv = sum(FSEGS.map(s => r.seg[s.k].c));
    r.lucroBruto = r.receita - r.cmv;
    r.opex = Math.round(45000 * Math.pow(1.008, i) + r.receita * 0.035) + (i === 21 ? 9000 : 0);
    r.impostos = Math.round(r.receita * 0.045);
    r.lucroOp = r.lucroBruto - r.opex; r.lucroLiq = r.lucroOp - r.impostos;
    r.margemBruta = r.lucroBruto / r.receita; r.margemOp = r.lucroOp / r.receita; r.margemLiq = r.lucroLiq / r.receita;
    r.capex = i === 15 ? 60000 : 6000; caixa += r.lucroLiq - r.capex; r.caixa = Math.round(caixa);
    r.clientes = i >= 18 ? CLIENTES.length : 11; r.ticketMedio = r.receita / r.clientes;
    const bR = sum(FSEGS.map(s => r.bseg[s.k].r)), bC = sum(FSEGS.map(s => r.bseg[s.k].c));
    r.b = { receita: bR, cmv: bC, lucroBruto: bR - bC, opex: Math.round(46000 * Math.pow(1.008, i) + bR * 0.034), impostos: Math.round(bR * 0.045) };
    r.b.lucroOp = r.b.lucroBruto - r.b.opex; r.b.lucroLiq = r.b.lucroOp - r.b.impostos;
    r.b.margemBruta = r.b.lucroBruto / bR; r.b.margemOp = r.b.lucroOp / bR; r.b.margemLiq = r.b.lucroLiq / bR; r.b.ticketMedio = bR / r.clientes;
  });
  rows.forEach((r, i) => { const j = Math.max(0, i - 3), n = i - j; r.geracao = n ? Math.round((r.caixa - rows[j].caixa) / n) : 0; });
  return rows;
})();

/* ================= COMPANY DNA ================= */
// cada traço é calculado dos dados e diz quantas ocorrências o sustentam; sem ocorrências suficientes, o MAE diz que ainda não sabe
function dnaTraits(){
  const T = [], occ = (n, u) => `${num(n)} ${u}`;
  // modelo comercial
  const segR = FSEGS.map(sg => ({ k: sg.k, r: sum(sg.ids.map(id => byId(CLIENTES, id).rec[5])), r0: sum(sg.ids.map(id => byId(CLIENTES, id).rec[0])) })).sort((a, b) => b.r - a.r);
  T.push({ g: "comercial", t: `${Math.round(A.concPct * 100)}% da receita vem de 3 clientes`, d: `${A.conc.map(c => c.nome).join(", ")}. Perder um deles pesa mais que qualquer queda de produto.`, base: occ(PEDIDOS.length, "pedidos"), fontes: ["Planilha de vendas"], n: 1,
    ev: A.conc.map(c => `${c.nome}: ${brl(c.rec[5])} em setembro (${(c.rec[5] / A.fatAtual * 100).toFixed(1).replace(".", ",")}% da receita)`) });
  T.push({ g: "comercial", t: `${segR[0].k} é o maior segmento; ${[...segR].sort((a, b) => (b.r / b.r0) - (a.r / a.r0))[0].k} é o que mais cresce`, d: `Participação no mês: ${segR.map(x => `${x.k} ${Math.round(x.r / A.fatAtual * 100)}%`).join(" · ")}.`, base: occ(PEDIDOS.length, "pedidos"), fontes: ["Planilha de vendas", "Cadastro de clientes"], n: 2,
    ev: segR.map(x => `${x.k}: ${brl(x.r0)} em abril → ${brl(x.r)} em setembro (${pct(x.r / x.r0 - 1, 0)})`) });
  const idx = FIN.map((r, i) => { const w = FIN.slice(Math.max(0, i - 6), i + 7); return r.receita / avg(w.map(x => x.receita)) - 1; });
  const moy = {}; FIN.forEach((r, i) => { const m = r.lbl.slice(0, 3); (moy[m] = moy[m] || []).push(idx[i]); });
  const rep2 = Object.entries(moy).filter(([, v]) => v.length >= 2 && v.every(x => x > 0.02));
  T.push({ g: "comercial", t: rep2.length ? `Pico recorrente em ${rep2.map(([m]) => m).join(", ")}` : "Sem sazonalidade confirmada ainda", d: rep2.length ? "Os mesmos meses ficaram acima da tendência nos 2 anos." : `Em ${FIN.length} meses nenhum mês ficou acima da tendência nos 2 anos seguidos. O MAE só afirma sazonalidade quando o padrão se repete.`, base: occ(FIN.length, "meses de faturamento"), fontes: ["Planilha de vendas (histórico)"], n: 1,
    ev: Object.entries(moy).map(([m, v]) => `${m}: ${v.map(x => pct(x, 1)).join(" e ")} em relação à média móvel`) });
  const cmpT = sum(FORNECEDORES.map(f => f.compras)), topF = [...FORNECEDORES].sort((a, b) => b.compras - a.compras).slice(0, 3);
  T.push({ g: "comercial", t: `3 fornecedores recorrentes concentram ${Math.round(sum(topF.map(f => f.compras)) / cmpT * 100)}% das compras`, d: topF.map(f => f.nome).join(", ") + ".", base: occ(FORNECEDORES.length * 8, "registros de compra"), fontes: ["Compras e fornecedores"], n: 1,
    ev: FORNECEDORES.map(f => `${f.nome}: ${brl(f.compras)}/mês (${Math.round(f.compras / cmpT * 100)}%)`) });
  // padrões operacionais
  const atrasoConv = A.convs.filter(m => m.tema === "atraso"), vr = A.atrasoForn[0];
  if (vr) T.push({ g: "operacao", t: `Atrasos de entrega se repetem com ${vr.nome}`, d: `${vr.atrasos} atrasos em 60 dias e ${atrasoConv.length} reclamações de clientes sobre atraso, em ${new Set(atrasoConv.map(m => m.c.id)).size} clientes diferentes.`, base: occ(vr.atrasos + atrasoConv.length, "ocorrências"), fontes: ["Compras e fornecedores", "WhatsApp"], n: 2,
    ev: [`${vr.nome}: ${vr.atrasos} atrasos registrados em 60 dias`, ...atrasoConv.map(m => `${m.c.nome} · ${dia(m.dt)}: "${m.txt}"`)] });
  const crit = A.prods.filter(x => x.mencPreco + x.mencConc > 0).sort((a, b) => (b.mencPreco + b.mencConc) - (a.mencPreco + a.mencConc));
  if (crit.length) T.push({ g: "operacao", t: `${crit[0].p.nome} é o produto mais sensível a preço`, d: `${crit[0].mencPreco} menções a preço e ${crit[0].mencConc} a concorrente; vendas ${pct(crit[0].v, 0)} no último mês.`, base: occ(crit[0].mencPreco + crit[0].mencConc, "menções em conversas"), fontes: ["WhatsApp", "Planilha de vendas"], n: 2,
    ev: A.convs.filter(m => m.prod === crit[0].p.id).map(m => `${m.c.nome} · ${dia(m.dt)}: "${m.txt}"`) });
  const nre = sum(A.reajustes.map(r => r.n));
  T.push({ g: "operacao", t: `Reajustes frequentes em ${A.reajMulti.map(r => r.f.cat.toLowerCase()).join(" e ") || "nenhuma categoria"}`, d: `${A.reajustes.filter(r => r.n).length} fornecedores reajustaram em 8 meses; ${A.reajMulti.map(r => `${r.f.nome} ${r.n} vezes`).join(", ")}.`, base: occ(nre, "reajustes"), fontes: ["Compras e fornecedores"], n: 1,
    ev: A.reajustes.filter(r => r.n).map(r => `${r.f.nome}: ${r.n} reajuste(s), ${pct(r.alta, 0)} acumulado`) });
  const ren = HIST.filter(h => h.tipo === "renovacao");
  T.push({ g: "operacao", t: "Contratos renovados com antecedência fecham", d: `${ren.filter(h => h.res === "sucesso").length} de ${ren.length} renovações antecipadas deram certo. ${A.contratos.length} contratos vencem nos próximos 30 dias.`, base: occ(ren.length, "renovações"), fontes: ["Histórico de ações", "Cadastro de clientes"], n: 2,
    ev: ren.map(h => `${h.titulo}: ${h.det}`) });
  // preferências
  const descs = PEDIDOS.map(x => x.desc), comDesc = descs.filter(x => x > 0);
  if (PEDIDOS.length) T.push({ g: "pref", t: `Desconto típico de ${avg(comDesc).toFixed(1).replace(".", ",")}%, máximo de ${Math.max(...descs)}%`, d: `${comDesc.length} de ${PEDIDOS.length} pedidos tiveram desconto. O de 5% aconteceu só com ${esc(byId(CLIENTES, PEDIDOS.find(x => x.desc === Math.max(...descs)).cli).nome)}, depois da queda de compras.`, base: occ(PEDIDOS.length, "pedidos"), fontes: ["Planilha de vendas"], n: 1,
    ev: [0, 1, 2, 3, 4, 5].map(v => `${v}% de desconto: ${descs.filter(x => x === v).length} pedidos`).filter(t => !t.includes(": 0 pedidos")) });
  const pz = PEDIDOS.map(x => x.prazo);
  if (PEDIDOS.length) T.push({ g: "pref", t: `Prazo médio de ${Math.round(avg(pz))} dias`, d: `Varia de ${Math.min(...pz)} a ${Math.max(...pz)} dias. Hotelaria e eventos recebem os prazos mais longos.`, base: occ(PEDIDOS.length, "pedidos"), fontes: ["Planilha de vendas"], n: 1,
    ev: [...new Set(CLIENTES.map(c => c.seg))].map(sg => { const v = PEDIDOS.filter(x => byId(CLIENTES, x.cli).seg === sg).map(x => x.prazo); return `${sg}: ${Math.round(avg(v))} dias em média (${v.length} pedidos)`; }) });
  const pref = FORNECEDORES.filter(f => f.part >= 0.55 && f.part < 1);
  T.push({ g: "pref", t: `Fornecedores preferenciais: ${pref.map(f => f.nome).join(", ")}`, d: "Cada um fica com mais da metade das compras da sua categoria.", base: occ(pref.length * 8, "meses de compras"), fontes: ["Compras e fornecedores"], n: 1,
    ev: pref.map(f => `${f.nome}: ${Math.round(f.part * 100)}% de ${f.cat.toLowerCase()}`) });
  const citou = CLIENTES.filter(c => c.conv.some(m => m.tags.includes("concorrente"))), caiu = citou.filter(c => A.reduz.some(x => x.c.id === c.id));
  T.push({ g: "pref", t: `Quem cita concorrente reduz compras: ${caiu.length} de ${citou.length}`, d: "Menção a concorrente no WhatsApp tem antecedido queda de compras. Por isso ela pesa na confiança dos sinais.", base: occ(citou.length, citou.length === 1 ? "cliente" : "clientes"), fontes: ["WhatsApp", "Planilha de vendas"], n: 2, pouco: citou.length < 5,
    ev: citou.map(c => `${c.nome}: citou concorrente; compras ${pct((avg(c.rec.slice(4)) - avg(c.rec.slice(0, 4))) / avg(c.rec.slice(0, 4)), 0)}`) });
  const ct = [...HIST, ...ST.results].filter(h => h.tipo === "contato");
  T.push({ g: "pref", t: `Contato rápido recupera clientes em ${Math.round(rate("contato") * 100)}% dos casos`, d: "Taxa de sucesso dos contatos feitos depois de uma queda de compras, incluindo os resultados que você registrou.", base: occ(ct.length, "contatos"), fontes: ["Histórico de ações", "Seu feedback"], n: 2,
    ev: ct.map(h => `${h.titulo || h.t}: ${h.det || h.res}`) });
  const rej = ST.recs.filter(r => r.status === "rejeitada");
  if (rej.length) { const byM = {}; rej.forEach(r => byM[r.motivo] = (byM[r.motivo] || 0) + 1); const top = Object.entries(byM).sort((a, b) => b[1] - a[1])[0];
    T.push({ g: "pref", t: `Você rejeita principalmente por "${top[0].toLowerCase()}"`, d: "O MAE usa seus motivos para ajustar o momento e o tipo das próximas recomendações.", base: occ(rej.length, rej.length === 1 ? "rejeição" : "rejeições"), fontes: ["Seu feedback"], n: 1, ev: rej.map(r => `${r.t}: ${r.motivo}`) }); }
  return T.map((x, i) => ({ ...x, id: "t" + i }));
}
let DNA = [];
function vDna(){
  DNA = dnaTraits();
  const G = [["comercial", "Modelo comercial", "Como a empresa vende: clientes, segmentos, sazonalidade e fornecedores recorrentes"], ["operacao", "Padrões operacionais", "O que se repete na operação: atrasos, produtos críticos, reajustes e contratos"], ["pref", "Preferências e comportamento", "Como a empresa negocia e decide: descontos, prazos, fornecedores preferidos e o que funciona"]];
  return `<div class="head reveal"><div class="eyebrow">Inteligência</div><h1>🧬 Company DNA</h1><p>O que o MAE aprendeu sobre a sua empresa. Cada traço mostra em quantas ocorrências se baseia e de onde veio; nada aqui é opinião. Clique para ver as ocorrências.</p></div>
    ${G.map(([g, t, sub]) => `<div class="card reveal"><h2>${t}</h2><p class="cs">${sub}</p><div class="dna">${DNA.filter(x => x.g === g).map(x => `<button class="trait" data-trait="${x.id}">
      <div class="tt">${esc(x.t)}</div><div class="td">${esc(x.d)}</div><div class="tb">Identificado com base em ${x.base}${x.pouco ? " · amostra pequena" : ""}</div>
      <div class="tf">${x.fontes.map(f => `<span class="tag">${esc(f)}</span>`).join("")}<span class="tag ${conf(x.n).c}">confiança ${conf(x.n).l.toLowerCase()}</span></div></button>`).join("")}</div></div>`).join("")}
    <div class="note reveal">O DNA se atualiza a cada sincronização e a cada resultado que você registra. Quando um padrão tem poucas ocorrências, o MAE avisa ("amostra pequena") em vez de tratar como regra.</div>`;
}
function openTrait(id){
  const x = DNA.find(t => t.id === id);
  openDrawer("Company DNA", x.t, `<div class="perceived"><div class="pt" style="display:block">✦ Como o MAE chegou nisso</div><div>${esc(x.d)}</div><div>Base: ${esc(x.base)} · fontes: ${esc(x.fontes.join(", "))}.</div></div>
    <div><div class="sec-t">Ocorrências observadas (${x.ev.length})</div>${x.ev.map(e => `<div class="ev"><div class="ei">▪</div><div><div class="ed" style="margin:0">${esc(e)}</div></div></div>`).join("")}</div>`);
}

/* ================= PERGUNTE À EMPRESA ================= */
const SUGS = ["Qual foi o lucro de setembro?", "Quais clientes estão comprando menos?", "Quanto faturamos com o Mercado Bom Preço nos últimos 6 meses?", "Quais fornecedores aumentaram preços este ano?", "O que o MAE aprendeu sobre a empresa?", "De onde vêm os dados?", "Por que nosso faturamento mudou este mês?", "Quais contratos vencem este mês?", "Quais produtos estão em queda?"];
let ASKED = null;
function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function answer(q){
  const n = norm(q);
  const cli = CLIENTES.find(c => n.includes(norm(c.nome)) || norm(c.nome).split(" ").filter(w => w.length > 4).some(w => n.includes(w)));
  if (cli && /(fatur|compr|venda|quanto)/.test(n)) return { a: `Nos últimos 6 meses (abr–set) faturamos <b>${brlFull(sum(cli.rec))}</b> com ${esc(cli.nome)}. Em setembro foram ${brlFull(cli.rec[5])}, ${pct(cli.rec[5] / cli.rec[4] - 1, 0)} em relação a agosto.`,
    ev: MESES.map((m, i) => `${m}: ${brlFull(cli.rec[i])}`), src: ["Planilha de vendas"], link: `cliente:${cli.id}` };
  if (/(lucro|margem)/.test(n)) { const d = FIN[FIN.length - 1], p = FIN[FIN.length - 2];
    return { a: `Em setembro o lucro líquido foi de <b>${brlFull(d.lucroLiq)}</b> (margem líquida de ${fpct(d.margemLiq)}), contra ${brlFull(p.lucroLiq)} em agosto e meta de ${brlFull(d.b.lucroLiq)}. A margem bruta foi de ${fpct(p.margemBruta)} para ${fpct(d.margemBruta)} porque o CMV subiu ${pct(d.cmv / p.cmv - 1)}.`,
      ev: [`Faturamento: ${brlFull(d.receita)}`, `CMV: ${brlFull(d.cmv)}`, `Despesas operacionais: ${brlFull(d.opex)}`, `Impostos: ${brlFull(d.impostos)}`, `Lucro líquido: ${brlFull(d.lucroLiq)}`], src: ["Planilha de vendas", "Compras e fornecedores"], link: "go:financeiro" }; }
  if (/(reduz|diminu|cair|caiu|queda|menos)/.test(n) && /client/.test(n)) return { a: `${A.reduz.length} clientes reduziram compras de forma relevante (≥ 20%): ${A.reduz.map(x => `<b>${esc(x.c.nome)}</b> (${pct(x.var, 0)})`).join(", ")}. Juntos são <b>${brl(A.reduzPerda)}/mês</b> a menos.`,
    ev: A.reduz.map(x => `${x.c.nome}: média ${brl(x.base)} → ${brl(x.rec)}`), src: ["Planilha de vendas", "WhatsApp"], link: "go:clientes" };
  if (/fornecedor/.test(n) && /(preco|aument|reajust)/.test(n)) return { a: `${A.reajustes.filter(r => r.n).length} fornecedores reajustaram preços em 8 meses. O maior foi <b>${esc(A.reajMulti[0].f.nome)}</b>: ${A.reajMulti[0].n} reajustes, ${pct(A.reajMulti[0].alta, 0)} acumulado.`,
    ev: A.reajustes.filter(r => r.n).map(r => `${r.f.nome}: ${r.n} reajuste(s), ${pct(r.alta, 0)}`), src: ["Compras e fornecedores (sincronizado há 4 dias)"], link: "go:fornecedores" };
  if (/fatur|receita/.test(n)) { const neg = A.contrib.filter(x => x.v < 0), posv = sum(A.contrib.filter(x => x.v > 0).map(x => x.v));
    return { a: `O faturamento foi de ${brl(A.fatAnt)} em agosto para <b>${brl(A.fatAtual)}</b> em setembro (${pct(A.varMes)}). Os clientes que cresceram somaram ${brl(posv)}, puxados por ${A.top4.slice(0, 2).map(x => `<b>${esc(x.c.nome)}</b> (+${brl(x.v)})`).join(" e ")}. As quedas somaram ${brl(-sum(neg.map(x => x.v)))}, principalmente ${neg.sort((a, b) => a.v - b.v).slice(0, 2).map(x => `<b>${esc(x.c.nome)}</b> (${brl(x.v)})`).join(" e ")}.`,
      ev: A.contrib.slice(0, 4).concat(A.contrib.slice(-3)).map(x => `${x.c.nome}: ${x.v >= 0 ? "+" : ""}${brl(x.v)}`), src: ["Planilha de vendas"], link: "go:insights" }; }
  if (/(aprend|dna|conhece.*empresa|padr)/.test(n)) { const T = dnaTraits();
    return { a: `O MAE identificou <b>${T.length} traços</b> da empresa. Os mais fortes: ${T.filter(x => x.n >= 2).slice(0, 3).map(x => `<b>${esc(x.t)}</b> (${esc(x.base)})`).join("; ")}.`, ev: T.map(x => `${x.t} · ${x.base}`), src: [...new Set(T.flatMap(x => x.fontes))], link: "go:dna" }; }
  if (/(de onde|fonte|dados .*vem|sincroniz|integra)/.test(n)) { const k = knowCounts();
    return { a: `Tudo vem de ${FONTES.filter(f => f.status !== "off").length} fontes conectadas: ${FONTES.filter(f => f.status !== "off").map(f => `<b>${esc(f.nome)}</b> (${f.sinc})`).join(", ")}. Hoje são <b>${num(k.registros)} registros</b>. ${FONTES.filter(f => f.status === "off").map(f => esc(f.nome)).join(", ")} ainda não está conectado, então estoque e notas fiscais ficam fora.`,
      ev: SYNC.map(x => `${x.ds}: ${x.ult} · ${x.fonte}`), src: FONTES.filter(f => f.status !== "off").map(f => f.nome), link: "go:dados" }; }
  if (/contrato/.test(n)) return { a: `${A.contratos.length} contratos vencem nos próximos 30 dias: ${A.contratos.map(c => `<b>${esc(c.nome)}</b> em ${dia(c.contrato)}`).join(", ")}.`, ev: A.contratos.map(c => `${c.nome}: ${brl(c.rec[5] * 12)}/ano`), src: ["Cadastro de clientes"], link: "go:contratos" };
  if (/produto/.test(n)) return { a: `${A.prodQueda.length} produtos estão em queda: ${A.prodQueda.map(x => `<b>${esc(x.p.nome)}</b> (${pct(x.v, 0)})`).join(", ")}.${A.prodQueda[0].mencPreco ? ` No ${esc(A.prodQueda[0].p.nome)}, clientes citaram preço ${A.prodQueda[0].mencPreco} vezes.` : ""}`,
    ev: A.prodQueda.map(x => `${x.p.nome}: set ${num(x.p.qtd[5])} un. vs média ${num(avg(x.p.qtd.slice(2, 5)))}`), src: ["Planilha de vendas", "WhatsApp"], link: "go:produtos" };
  return null;
}
function ask(q){ ASKED = q; if (ROUTE !== "pergunte") { ROUTE = "pergunte"; try { history.replaceState(null, "", "#pergunte"); } catch (e) {} } closeDrawer(); render(); }
function vPergunte(){
  let ans = "";
  if (ASKED) { const r = answer(ASKED);
    ans = r ? `<div class="card answer reveal"><div class="q">${esc(ASKED)}</div><div class="a">${r.a}</div>
      <div><div class="sec-t">Evidências usadas</div>${r.ev.map(e => `<div class="ev"><div class="ei">▪</div><div><div class="ed" style="margin:0">${esc(e)}</div></div></div>`).join("")}</div>
      <div class="srcs">Fontes: ${r.src.map(s => `<span class="tag">${esc(s)}</span>`).join("")}<button class="btn ghost sm" data-act="${r.link}">abrir ›</button></div></div>`
      : `<div class="card answer reveal"><div class="q">${esc(ASKED)}</div><div class="a">Não encontrei dados suficientes para responder com segurança. No protótipo, o MAE responde perguntas sobre faturamento por cliente, lucro, clientes em queda, reajustes de fornecedores, contratos, produtos, o DNA da empresa e a origem dos dados. No produto final, essa área usa o motor de perguntas do backend do MAE.</div></div>`; }
  return `<div class="head reveal"><div class="eyebrow">🧠 Pergunte à empresa</div><h1>O que você quer saber?</h1><p>O MAE responde a partir dos dados disponíveis e mostra as evidências. Se não houver dado suficiente, ele diz isso em vez de inventar.</p></div>
    <form class="ask-box reveal" id="ask-form"><input id="ask-in" placeholder="Ex.: quanto faturamos com o Hotel Vista Mar?" aria-label="Pergunta" value="${ASKED ? esc(ASKED) : ""}"><button class="btn p" type="submit">Perguntar</button></form>
    <div class="sugs reveal">${SUGS.map(q => `<button class="sug" data-act="ask:${encodeURIComponent(q)}">${esc(q)}</button>`).join("")}</div>${ans}`;
}

/* ================= RENDER ================= */
const VIEWS = { visao: vVisao, financeiro: vFinanceiro, clientes: vClientes, fornecedores: vFornecedores, produtos: vProdutos, contratos: vContratos, conversas: vConversas, insights: vInsights, recomendacoes: vRecs, acoes: vAcoes, resultados: vResultados, aprendizado: vAprendizado, pergunte: vPergunte, dados: vDados, dna: vDna };
function countUp(el, target, fmt, dur = 900){ if (!el) return; if (REDUCE) { el.textContent = fmt(target); return; } const t0 = performance.now();
  (function st(now){ const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3); el.textContent = fmt(target * e); if (t < 1) requestAnimationFrame(st); })(performance.now()); }
function render(){
  if (!VIEWS[ROUTE]) ROUTE = "visao";
  renderNav();
  const v = document.getElementById("view");
  v.innerHTML = (IS_DEMO ? `<div class="demo-bar"><b>Demonstração</b><span>Dados fictícios de ${esc(EMPRESA)}. Numa conta real, o MAE usa apenas as fontes conectadas da sua empresa.</span>${ROUTE !== "dados" ? '<button data-act="go:dados">Ver de onde vêm os dados ›</button>' : ""}</div>` : "") + VIEWS[ROUTE]();
  wire(v);
  [...v.querySelectorAll(".reveal")].forEach((el, i) => { el.style.animationDelay = REDUCE ? "0ms" : (i * 60) + "ms"; el.classList.add("in"); });
  if (ROUTE === "visao") countUp(document.getElementById("hero-imp"), SIGNALS[0].imp, x => brl(x) + "/mês");
  if (ROUTE === "aprendizado") requestAnimationFrame(() => requestAnimationFrame(() => v.querySelectorAll(".lf").forEach(el => el.style.width = el.dataset.w + "%")));
  if (ROUTE === "clientes") document.getElementById("q-cli").addEventListener("input", e => { const q = norm(e.target.value); document.querySelectorAll("#cli-body tr").forEach(tr => tr.hidden = q && !norm(tr.dataset.s).includes(q)); });
  if (ROUTE === "conversas") document.querySelectorAll("#conv-f button").forEach(b => b.addEventListener("click", () => { document.querySelectorAll("#conv-f button").forEach(x => x.classList.toggle("on", x === b)); const t = b.dataset.t;
    document.querySelectorAll("#conv-list > div").forEach(el => el.hidden = t !== "todas" && !el.dataset.tags.split(",").includes(t)); }));
  if (ROUTE === "recomendacoes") document.querySelectorAll("#rec-tabs button").forEach(b => b.addEventListener("click", () => { REC_TAB = b.dataset.k; render(); }));
  if (ROUTE === "financeiro") finWire();
  if (ROUTE === "dados") document.querySelectorAll("#dados-tabs button").forEach(b => b.addEventListener("click", () => { DADOS_TAB = b.dataset.t; render(); }));
  if (ROUTE === "dna") v.querySelectorAll("[data-trait]").forEach(b => b.addEventListener("click", () => openTrait(b.dataset.trait)));
  if (ROUTE === "pergunte") document.getElementById("ask-form").addEventListener("submit", e => { e.preventDefault(); const q = document.getElementById("ask-in").value.trim(); if (q) ask(q); });
}
render();
