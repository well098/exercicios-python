<title>Painel Executivo</title>
<style>
  /* Tokens padrão (paleta "violeta"). Outras paletas são aplicadas por CONFIG.palette. Tema claro travado. */
  :root {
    color-scheme: light;
    --bg: #f3f1fb; --surface: #ffffff; --surface-2: #f7f5fe;
    --ink: #241a4d; --ink-2: #6b6396; --muted: #a49dc4; --hair: #ece9f7; --hair-2: #ddd8f0;
    --accent: #6a4bff;
    --c1: #6a4bff; --c2: #12b5dc; --c3: #ff7a1a; --c4: #ff4d9d; --c5: #23c552;
    --grad-hero: linear-gradient(140deg, #7b5cff 0%, #b84dff 55%, #ff5db1 100%);
    --grad-alt: linear-gradient(155deg, #17c8e6 0%, #4b7bff 60%, #7b5cff 100%);
    --glow-1: rgba(122,92,255,0.16); --glow-2: rgba(255,77,157,0.12);
    --good: #12a150; --good-rgb: 18,161,80; --good-soft: #e4f8ec;
    --bad: #e5194b;  --bad-rgb: 229,25,75;  --bad-soft: #ffe6ec;
    --warn: #c98200; --amber: #f0a500; --warn-soft: #fff3d6;
    --shadow: 0 2px 8px rgba(40,30,90,0.06), 0 18px 44px rgba(40,30,90,0.10);
    --shadow-sm: 0 1px 4px rgba(40,30,90,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(1100px 520px at 0% -10%, var(--glow-1), transparent 60%),
                      radial-gradient(900px 480px at 100% 0%, var(--glow-2), transparent 55%);
    color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; padding-inline: 20px; padding-block: 26px; min-height: 100%;
  }
  .wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; }
  .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  .topbar h1 { font-size: 28px; margin: 5px 0 0; letter-spacing: -0.025em; }
  .topbar .sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .exports { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn { font-size: 12.5px; font-weight: 700; border: 0; border-radius: 11px; padding: 10px 15px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.97); }
  .btn.dark { background: var(--ink); color: #fff; box-shadow: var(--shadow-sm); }
  .btn.dark:hover { background: var(--accent); }
  .btn.ghost { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .export-note { font-size: 11.5px; color: var(--ink-2); min-height: 14px; text-align: right; margin-top: 4px; }

  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px;
    padding: 10px 14px; box-shadow: var(--shadow-sm); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  .filters .f { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filters label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .filters select { font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--hair-2); border-radius: 9px; padding: 7px 10px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { font-size: 12.5px; font-weight: 700; white-space: nowrap; padding: 7px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button[hidden] { display: none; }
  .filters .spacer { flex: 1; }
  .filters .ctx { font-size: 12px; color: var(--ink-2); }
  @media (max-width: 480px) { .seg button { padding: 7px 9px; font-size: 12px; } }

  .tier-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 10px; margin-bottom: -6px; }
  .tier-label::after { content: ""; flex: 1; height: 1px; background: var(--hair-2); }

  .reveal { opacity: 0; transform: translateY(14px) scale(.985); }
  .reveal.in { animation: pop .55s cubic-bezier(.2,.8,.25,1) forwards; }
  @keyframes pop { to { opacity: 1; transform: none; } }

  .t1 { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 14px; }
  .t1.n2 { grid-template-columns: 1.35fr 1fr; } .t1.n1 { grid-template-columns: 1fr; }
  @media (max-width: 900px) { .t1, .t1.n2 { grid-template-columns: 1fr; } }
  .t2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .t2 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 440px) { .t2 { grid-template-columns: 1fr; } }

  .tile { background: var(--surface); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 5px; cursor: pointer; border: 0; text-align: left; color: inherit; width: 100%; transition: transform .15s, box-shadow .15s; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(40,30,90,.1), 0 24px 50px rgba(40,30,90,.14); }
  .tile .tl { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
  .tile .tl .drill { font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .tile .tv { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .tile .td { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; margin-top: 2px; }
  .tile.hero { background: var(--grad-hero); color: #fff; }
  .tile.alt { background: var(--grad-alt); color: #fff; }
  .tile.hero .tv { font-size: 44px; }
  .tile.hero .tl, .tile.hero .tl .drill, .tile.alt .tl, .tile.alt .tl .drill { color: rgba(255,255,255,.85); }
  .tile.t2t .tv { font-size: 24px; }
  .chip { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.good { background: var(--good-soft); color: var(--good); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.neutral { background: var(--surface-2); color: var(--ink-2); }
  .on-color .chip { background: rgba(255,255,255,.2); color: #fff; }
  .tile .cmp-lbl { font-size: 11px; opacity: .8; }
  .tile .spark { margin-top: auto; padding-top: 8px; }
  .tile .foot { font-size: 11.5px; opacity: .88; margin-top: auto; padding-top: 6px; }

  .ratios { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 900px) { .ratios { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 440px) { .ratios { grid-template-columns: 1fr; } }
  .ratio { background: var(--surface); border-radius: 16px; padding: 13px 15px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 3px; border-left: 4px solid var(--hair-2); }
  .ratio.good { border-left-color: var(--good); } .ratio.bad { border-left-color: var(--bad); } .ratio.warn { border-left-color: var(--amber); }
  .ratio .rl { font-size: 11.5px; color: var(--ink-2); font-weight: 600; } .ratio .rv { font-size: 20px; font-weight: 800; } .ratio .rn { font-size: 11px; color: var(--muted); }

  .card { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 3px; } .card .csub { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
  .grid-2.single { grid-template-columns: 1fr; }
  @media (max-width: 960px) { .grid-2 { grid-template-columns: 1fr; } }

  .table-wrap { overflow-x: auto; }
  table.var { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 520px; }
  table.var th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; text-align: right; padding: 6px 8px; border-bottom: 2px solid var(--hair-2); }
  table.var th:first-child { text-align: left; }
  table.var td { padding: 8px; text-align: right; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  table.var td:first-child { text-align: left; font-weight: 600; }
  table.var tr.sub td:first-child { font-weight: 500; color: var(--ink-2); padding-left: 18px; }
  table.var tr.total td { font-weight: 800; }
  table.var tbody tr { cursor: pointer; } table.var tbody tr:hover { background: var(--surface-2); }
  table.var td.cf { font-weight: 700; border-radius: 6px; }

  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .ax { fill: var(--muted); font-size: 10.5px; }
  .grid-line { stroke: var(--hair); stroke-width: 1; }
  .chart-wrap { position: relative; overflow-x: auto; }
  .tooltip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 11.5px; padding: 8px 10px; border-radius: 9px; opacity: 0; transition: opacity .12s; white-space: nowrap; z-index: 9; line-height: 1.55; box-shadow: var(--shadow); }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .legend button { font-size: 12px; background: transparent; border: 0; cursor: pointer; color: var(--ink-2); display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px; }
  .legend button:hover { background: var(--surface-2); } .legend button.off { opacity: .35; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend .dash { width: 16px; border-top: 2px dashed var(--ink-2); display: inline-block; }

  .scrub-row { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .scrub-row input[type=range] { flex: 1; min-width: 180px; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 6px; background: var(--hair); cursor: pointer; }
  .scrub-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: var(--shadow-sm); }
  .scrub-row input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
  .scrub-read { display: flex; gap: 16px; flex-wrap: wrap; }
  .scrub-read .sr { display: flex; flex-direction: column; } .scrub-read .sr .t { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; } .scrub-read .sr .v { font-size: 15px; font-weight: 800; }
  .proj-tag { font-size: 10px; font-weight: 800; color: var(--accent); background: var(--surface-2); padding: 2px 7px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }

  .segrow { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; color: inherit; }
  .segrow:hover { background: var(--surface-2); }
  .segrow .sn { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .segrow .st { display: block; height: 14px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
  .segrow .sf { display: block; height: 100%; width: 0; border-radius: 7px; transition: width 1s cubic-bezier(.2,.8,.25,1); }
  .segrow .sv { font-size: 12.5px; text-align: right; } .segrow .sv b { font-size: 13.5px; } .segrow .sv span { display: block; font-size: 11px; color: var(--muted); }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }

  .ins-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 760px) { .ins-list { grid-template-columns: 1fr; } }
  .ins { background: var(--surface-2); border-radius: 14px; padding: 14px 15px; border-left: 4px solid var(--accent); font-size: 13px; line-height: 1.55; color: var(--ink-2); opacity: 0; transform: translateY(10px); }
  .ins.in { animation: pop .45s cubic-bezier(.2,.8,.25,1) forwards; }
  .ins.good { border-left-color: var(--good); } .ins.bad { border-left-color: var(--bad); } .ins.warn { border-left-color: var(--amber); }
  .ins .it { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--ink); margin-bottom: 4px; }
  .ins b { color: var(--ink); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 760px) { .summary { grid-template-columns: 1fr; } }
  .sum { border-radius: 14px; padding: 14px; background: var(--surface-2); }
  .sum .sh { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .sum.good .sh { color: var(--good); } .sum.bad .sh { color: var(--bad); } .sum.warn .sh { color: var(--warn); }
  .sum .st { font-size: 14.5px; font-weight: 700; margin: 6px 0 3px; } .sum .sb { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .ai-box { margin-top: 14px; border-radius: 14px; border: 1px dashed var(--hair-2); padding: 14px; display: none; }
  .ai-box.show { display: block; }
  .ai-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ai-out { margin-top: 10px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; } .ai-out:empty { display: none; }
  .ai-status { font-size: 12px; color: var(--ink-2); }

  details.audit { background: var(--surface-2); border-radius: 14px; padding: 12px 16px; margin-top: 10px; }
  details.audit summary { cursor: pointer; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; gap: 8px; }
  details.audit summary::-webkit-details-marker { display: none; }
  details.audit summary::before { content: "▸"; color: var(--accent); transition: transform .2s; display: inline-block; }
  details.audit[open] summary::before { transform: rotate(90deg); }
  details.audit ol, details.audit ul { margin: 10px 0 2px; padding-left: 20px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }

  .backdrop { position: fixed; inset: 0; background: rgba(30,20,60,.28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 100%); background: var(--surface); z-index: 41; box-shadow: -20px 0 50px rgba(30,20,60,.18);
    transform: translateX(104%); transition: transform .32s cubic-bezier(.2,.8,.25,1); display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .drawer.open { transform: none; }
  .drawer .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 20px 20px 10px; border-bottom: 1px solid var(--hair); }
  .drawer .dh h3 { margin: 0; font-size: 18px; } .drawer .dh p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }
  .drawer .close { border: 0; background: var(--surface-2); border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: var(--ink); flex-shrink: 0; }
  .drawer .db { overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  table.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.dt th { font-size: 10.5px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 5px 6px; border-bottom: 2px solid var(--hair-2); }
  table.dt th:first-child, table.dt td:first-child { text-align: left; }
  table.dt td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  table.dt tr.sel td { background: var(--surface-2); font-weight: 700; }
  .dnote { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 11px 13px; line-height: 1.55; }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .ins { opacity: 1 !important; transform: none !important; animation: none !important; }
    .drawer, .backdrop, .segrow .sf { transition: none !important; }
  }
  footer.note { font-size: 11.5px; color: var(--muted); text-align: center; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div>
      <div class="exports">
        <button class="btn ghost" id="btn-csv" hidden>⭳ Exportar CSV</button>
        <button class="btn dark" id="btn-pdf" hidden>⭳ Relatório PDF</button>

  </div>

  <div class="filters" role="toolbar" aria-label="Filtros">

      <div class="seg" id="f-cmp">
        <button data-c="prev" class="on">Período anterior</button>
        <button data-c="yoy">Ano anterior</button>
        <button data-c="bud">Meta</button>
      </div>
    </div>

    <div class="ctx" id="f-ctx"></div>
  </div>

  <div class="tier-label" id="tl-1"></div>

  <div class="tier-label" id="tl-2"></div>
  <div class="t2" id="t2"></div>
  <div class="tier-label" id="tl-3"></div>
  <div class="ratios" id="ratios"></div>

  <div class="grid-2" id="row-var">
    <div class="card reveal">
      <h2>Análise de variação</h2>

  </div>

  <div class="grid-2" id="row-seg">

<div class="backdrop" id="backdrop"></div>

  <div class="db" id="dr-body"></div>

<script>
/* =====================================================================
   CONFIG START — tudo que muda de um painel para outro fica aqui.
   Veja references/engine-config.md para o contrato completo.
   ===================================================================== */
const CONFIG = (() => {
  const SEGS = ["SaaS", "Serviços", "Hardware"];
  const rows = [];
  let caixa = 4300000;
  for (let i = 0; i < 24; i++) {
    const d = new Date(2024, 9 + i, 1);
    const p = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    const sR = 240000 * Math.pow(1.03, i) * (1 + 0.025 * Math.sin(i * 1.7));
    const vR = 120000 * Math.pow(1.012, i) * (1 + 0.04 * Math.sin(i * 0.9 + 1));
    const hR = 58000 * Math.pow(1.005, i) * (1 + 0.2 * Math.sin((i + 2) * Math.PI / 6));
    const dim = {
      "SaaS":     { receita: Math.round(sR), cmv: Math.round(sR * (0.18 + 0.01 * Math.sin(i))) },

  const mag = dl.pct !== undefined ? Math.min(1, Math.abs(dl.pct) / 0.15) : dl.isPct ? Math.min(1, Math.abs(dl.diff) / 0.03) : dl.abs ? Math.min(1, Math.abs(dl.diff) / 10) : Math.min(1, Math.abs(dl.diff) / (rowRef * 0.05));
  const rgb = dl.fav ? cvar("--good-rgb") : cvar("--bad-rgb");

}

  const B = CONFIG.bridge, i = state.idx, cur = R[i].v, svg = document.getElementById("bridge");
  document.getElementById("bridge-title").textContent = B.title || "Ponte de variação";
  const base0 = baseVal(i, B.target);

  if (base0 == null) { sub.textContent = "Sem base de comparação para este período."; svg.innerHTML = `<text class="ax" x="280" y="150" text-anchor="middle">Escolha outro período ou outra base</text>`; return; }
  const unit = M[B.target].unit;
  sub.textContent = `Como ${M[B.target].label.toLowerCase()} foi de ${fmt(unit, base0)} (${CMP_LBL[state.cmp]}) para ${fmt(unit, cur[B.target])}. Cada barra é o efeito de uma linha.`;
  const steps = [{ l: "Base", v: base0, total: true }];
  B.parts.forEach(pt => { const b = baseVal(i, pt.key); if (b != null) steps.push({ l: pt.label || M[pt.key].label, v: pt.sign * (cur[pt.key] - b) }); });
  const explained = steps.slice(1).reduce((a, s) => a + s.v, 0), resid = cur[B.target] - base0 - explained;
  if (Math.abs(resid) > Math.abs(cur[B.target]) * 0.005) steps.push({ l: "Outros", v: resid });
  steps.push({ l: "Atual", v: cur[B.target], total: true });
  let run = 0; const bars = steps.map(s => { if (s.total) { run = s.v; return { ...s, y0: 0, y1: s.v }; } const a = run; run += s.v; return { ...s, y0: a, y1: run }; });
  const W = 560, H = 300, padL = 58, padR = 14, padT = 26, padB = 34, plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = bars.flatMap(x => [x.y0, x.y1]); let mn = Math.min(0, ...vals), mx = Math.max(0, ...vals); const pad = (mx - mn) * 0.12; mx += pad; if (mn < 0) mn -= pad;
  const y = v => padT + plotH - ((v - mn) / (mx - mn)) * plotH, slot = plotW / bars.length, bw = slot * 0.58;

  s += `<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke="${cvar("--hair-2")}" stroke-width="1.4"/>`;
  bars.forEach((bb, k) => {

    const col = bb.total ? cvar("--accent") : !M[B.target].dir ? cvar("--c2") : bb.v * M[B.target].dir >= 0 ? cvar("--good") : cvar("--bad");
    s += `<rect class="bb" data-k="${k}" x="${(cx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="4" fill="${col}" style="transform-origin:${cx}px ${y(bb.y0)}px;${REDUCE ? "" : `animation:grow .6s cubic-bezier(.2,.8,.25,1) ${k * 90}ms both`}"/>`;
    s += `<text class="ax" x="${cx}" y="${(top - 6).toFixed(1)}" text-anchor="middle" style="fill:${bb.total ? cvar("--ink") : col};font-weight:700">${bb.total ? fmt(unit, bb.v) : (bb.v >= 0 ? "+" : "−") + fmt(unit, Math.abs(bb.v))}</text>`;
    s += `<text class="ax" x="${cx}" y="${H - 12}" text-anchor="middle">${bb.l}</text>`;
    if (k < bars.length - 1) s += `<line x1="${(cx + bw / 2).toFixed(1)}" x2="${(padL + slot * (k + 1.5) - bw / 2).toFixed(1)}" y1="${y(bb.y1)}" y2="${y(bb.y1)}" stroke="${cvar("--hair-2")}" stroke-dasharray="3 3"/>`;
  });
  svg.innerHTML = `<style>@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}</style>` + s;
  const tt = document.getElementById("bridge-tt");
  svg.querySelectorAll(".bb").forEach(el => {
    el.addEventListener("mouseenter", () => {
      const bb = bars[+el.dataset.k];
      tt.innerHTML = bb.total ? `<b>${bb.l}</b><br>${fmt(unit, bb.v, true)}` : `<b>Efeito ${bb.l}</b><br>${bb.v >= 0 ? "+" : "−"}${fmt(unit, Math.abs(bb.v), true)}<br><span style="opacity:.8">${bb.v * M[B.target].dir >= 0 ? "a favor" : "contra"}</span>`;
      tt.style.opacity = 1; const r = svg.getBoundingClientRect(), wr = svg.parentElement.getBoundingClientRect();

const TS = CONFIG.trend.series, HZ = CONFIG.trend.horizon ?? 6;
const TCOL = ["--c1", "--c3", "--c5", "--c2", "--c4"];
function project(key){
  const pts = R.slice(-12).map(r => r.v[key]).filter(v => v != null && isFinite(v)); const n = pts.length;
  if (n < 3) return [];
  const xm = (n - 1) / 2, ym = pts.reduce((a, b) => a + b, 0) / n; let sxy = 0, sxx = 0;
  pts.forEach((v, j) => { sxy += (j - xm) * (v - ym); sxx += (j - xm) ** 2; });
  const slope = sxy / sxx, inter = ym - slope * xm;
  const resid = Math.sqrt(pts.reduce((a, v, j) => a + (v - (inter + slope * j)) ** 2, 0) / Math.max(1, n - 2));
  const out = []; for (let h = 1; h <= HZ; h++) { const x = n - 1 + h, v = inter + slope * x, band = 1.28 * resid * Math.sqrt(1 + 1 / n + ((x - xm) ** 2) / sxx); out.push({ v, lo: v - band, hi: v + band }); }
  return out;
}

  if (mn < 0 && mx > 0) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke="${cvar("--hair-2")}" stroke-width="1.4"/>`;

  const sc = document.getElementById("scrub"); sc.max = N - 1;
  svg.querySelectorAll(".hit").forEach(r => {

    r.addEventListener("mousemove", set); r.addEventListener("click", () => { set(); if (+r.dataset.j < R.length) setPeriod(+r.dataset.j); });

// -------- insights genéricos + resumo --------
let INS = [], SUM = null;
function buildInsights(){
  const i = state.idx, row = R[i], out = [], hero = CONFIG.insightMetric || CONFIG.trend.series[0], mh = M[hero];
  const on = r => !(CONFIG.autoInsights && CONFIG.autoInsights[r] === false);
  // 1. ritmo do indicador principal
  if (on("pace") && i >= 6) {
    const a = R.slice(i - 6, i + 1).map(r => r.v[hero]); const g = a.slice(1).map((v, k) => (v - a[k]) / Math.abs(a[k] || 1));
    const recent = (g[3] + g[4] + g[5]) / 3, prior = (g[0] + g[1] + g[2]) / 3, good = (recent > prior) === (mh.dir > 0);
    out.push({ cls: good ? "good" : "warn", t: `Ritmo de ${mh.label.toLowerCase()}`,
      h: `Variação média de <b>${signed(recent * 100, 1)}%/período</b> nos últimos 3 períodos, contra <b>${signed(prior * 100, 1)}%/período</b> nos 3 anteriores. O ritmo está <b>${recent > prior ? "acelerando" : "desacelerando"}</b>.`,
      p: `${mh.label}: ${signed(recent * 100, 1)}%/período nos últimos 3 contra ${signed(prior * 100, 1)}% nos 3 anteriores.` });
  }
  // 2. maior desvio contra a base
  const cands = CONFIG.table.map(t => typeof t === "string" ? t : t.key).map(k => { const b = baseVal(i, k), dl = delta(k, row.v[k], b); return dl ? { k, dl, score: dl.pct !== undefined ? Math.abs(dl.pct) : dl.isPct ? Math.abs(dl.diff) * 3 : dl.abs ? Math.abs(dl.diff / (b || 1)) : Math.abs(dl.diff) / Math.abs(row.v[hero] || 1) } : null; }).filter(Boolean).sort((a, b) => b.score - a.score);
  if (on("deviation") && cands.length) { const L = cands[0];
    out.push({ cls: L.dl.fav ? "good" : "bad", t: `Maior desvio vs ${CMP_LBL[state.cmp]}`,
      h: `<b>${M[L.k].label}</b> variou <b>${L.dl.txt}</b> (${fm(L.k, baseVal(i, L.k))} → ${fm(L.k, row.v[L.k])}), ${L.dl.fav ? "a favor" : "contra"} o resultado.`,
      p: `${M[L.k].label} variou ${L.dl.txt} (${fm(L.k, baseVal(i, L.k))} -> ${fm(L.k, row.v[L.k])}).` }); }

    doc.setTextColor(...ink); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text(pdfSafe(title), Mg, y); y += 6;
    items.forEach(it => { if (y > 275) { doc.addPage(); y = 20; } doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(...(it.col || ink)); doc.text(pdfSafe(it.h), Mg, y); y += 4.6;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...ink2); const ls = doc.splitTextToSize(pdfSafe(it.b), W - 2 * Mg); doc.text(ls, Mg, y); y += ls.length * 4.2 + 2.5; }); };
  section("Resumo executivo", (SUM || []).map(s => ({ h: s.h + ": " + s.t, b: s.b, col: s.cls === "good" ? good : s.cls === "bad" ? bad : hexRGB(cvar("--warn")) })));
  section("Insights", INS.map(x => ({ h: x.t, b: x.p })));
  const ai = document.getElementById("ai-out").textContent.trim(); if (ai) section("Parecer (Claude)", [{ h: "", b: ai }]);
  const pages = doc.getNumberOfPages(); for (let pg = 1; pg <= pages; pg++) { doc.setPage(pg); doc.setFontSize(7.5); doc.setTextColor(...ink2); doc.text(pdfSafe(`${CONFIG.title} - ${pLabel(i)} - página ${pg} de ${pages}`), W - Mg, 292, { align: "right" }); }
  return doc.output("arraybuffer");
}
const RT = (typeof window.claude !== "undefined" && window.claude && typeof window.claude.use === "function") ? window.claude : null;
let DL = null, SAMPLE = null;
const note = document.getElementById("export-note");
function slug(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
async function doSave(filename, make){
  if (!DL) return; let data;
  try { data = make(); } catch (err) { note.textContent = err.message === "jspdf" ? "O gerador de PDF não carregou. Recarregue a página." : "Não foi possível montar o arquivo."; return; }
  note.textContent = "Aguardando sua confirmação…";
  try { await DL.save({ filename, data }); note.textContent = `${filename} salvo.`; }
  catch (e) { const c = e && e.code;
    note.textContent = c === "declined" ? "Exportação cancelada." : c === "rate_limited" ? "Já há uma confirmação aberta. Tente de novo em instantes." : c === "extension_not_enabled" ? "Este formato não está disponível aqui." : "Não foi possível exportar nesta visualização.";
    if (["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(c)) { document.getElementById("btn-csv").hidden = true; document.getElementById("btn-pdf").hidden = true; } }
}
document.getElementById("btn-csv").addEventListener("click", () => doSave(`${slug(CONFIG.title)}-${slug(pLabel(state.idx))}.csv`, buildCSV));
document.getElementById("btn-pdf").addEventListener("click", () => doSave(`${slug(CONFIG.title)}-${slug(pLabel(state.idx))}.pdf`, buildPDF));

// -------- parecer com Claude (capacidade sample) --------
let aiCtl = null;
function aiPrompt(){
  const i = state.idx, row = R[i];
  const lines = CONFIG.table.map(t => typeof t === "string" ? t : t.key).map(k => { const b = baseVal(i, k), dl = delta(k, row.v[k], b); return `${M[k].label}: atual ${fm(k, row.v[k], true)}; base ${fm(k, b, true)}; variação ${dl ? dl.txt : "n/d"}`; }).join("\n");
  const bd = CONFIG.breakdown ? CONFIG.breakdown.members.map(m => `${m.k}: ${fm(CONFIG.breakdown.metric, (row.dim[m.k] || {})[CONFIG.breakdown.metric], true)}`).join("\n") : "";
  return `Você é o executivo responsável por ${CONFIG.aiContext || "esta operação"}. Escreva um parecer executivo em português do Brasil sobre ${pFull(i)}, comparando com ${CMP_LBL[state.cmp]}.

Regras: no máximo 180 palavras; 3 parágrafos curtos (desempenho, causas do desvio, próximos passos); cite números exatos; nada de conselho genérico; sem títulos nem marcadores; texto simples sem markdown.

Indicadores:
${lines}
${bd ? "\nComposição:\n" + bd + "\n" : ""}
Insights já calculados:
${INS.map(x => "- " + x.p).join("\n")}`;
}
document.getElementById("ai-btn").addEventListener("click", async () => {
  if (!SAMPLE) return; const out = document.getElementById("ai-out"), st = document.getElementById("ai-status"), btn = document.getElementById("ai-btn"), stop = document.getElementById("ai-stop");
  aiCtl = new AbortController(); btn.disabled = true; stop.hidden = false; out.textContent = ""; st.textContent = "Pensando…";
  try { const { truncated } = await SAMPLE(aiPrompt(), { signal: aiCtl.signal, onText: ({ text }) => { out.textContent = text; st.textContent = "Escrevendo…"; } });
    st.textContent = truncated ? "Parecer cortado no limite de tamanho." : `Parecer de ${pLabel(state.idx)} vs ${CMP_LBL[state.cmp]}. Entra no PDF.`; }
  catch (e) { out.textContent = e && e.text ? e.text : "";
    if (e && e.code === "cancelled") st.textContent = "Parado.";
    else { st.textContent = ({ not_granted: "Uso do Claude não autorizado nesta página.", sampling_disabled: "O Claude não está disponível para esta conta.", rate_limited: "Limite de uso atingido. Tente mais tarde.", session_expired: "Sessão expirada. Entre de novo no Claude.", refused: "O Claude não respondeu a esse pedido.", empty_completion: "A resposta veio vazia. Tente de novo." })[e && e.code] || "Não foi possível gerar o parecer agora. Tente de novo.";
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) document.getElementById("ai-box").classList.remove("show"); } }
  finally { btn.disabled = false; stop.hidden = true; }
});
document.getElementById("ai-stop").addEventListener("click", () => aiCtl && aiCtl.abort());
if (RT) {
  RT.use("downloads").then(d => { DL = d; if (d) { document.getElementById("btn-csv").hidden = false; document.getElementById("btn-pdf").hidden = false; } }).catch(() => {});
  RT.use("sample").then(s => { SAMPLE = s; if (s) document.getElementById("ai-box").classList.add("show"); }).catch(() => {});
}

// -------- boot --------
document.title = CONFIG.title;
document.getElementById("eyebrow").textContent = CONFIG.eyebrow || "";
document.getElementById("title").textContent = CONFIG.title;
document.getElementById("subtitle").textContent = CONFIG.subtitle || "";
document.getElementById("footnote").textContent = CONFIG.footnote || "";
const TL = (CONFIG.tiers.labels || []);
["tl-1", "tl-2", "tl-3"].forEach((id, n) => { const el = document.getElementById(id); el.textContent = TL[n] || ""; el.hidden = !TL[n]; });
if (!T2.length) { document.getElementById("t2").hidden = true; document.getElementById("tl-2").hidden = true; }
buildLegend(); renderAudit(); renderAll(true);
</script>
