<title>Cockpit do CFO</title>
<style>
  /* ===== PALETA (tema claro travado — não segue o tema do sistema) ===== */
  :root {
    color-scheme: light;
    --bg: #f3f1fb;
    --bg-tint: #ece8fa;
    --surface: #ffffff;
    --ink: #241a4d;
    --ink-2: #6b6396;
    --muted: #a49dc4;
    --hair: #ece9f7;
    --hair-2: #ddd8f0;

    --violet: #6a4bff;
    --magenta: #ff4d9d;
    --orange: #ff7a1a;
    --amber: #ffb703;
    --lime: #23c552;
    --cyan: #12c2e9;
    --rose: #ff3b6b;

    --grad-receita: linear-gradient(140deg, #7b5cff 0%, #b84dff 55%, #ff5db1 100%);
    --grad-runway:  linear-gradient(155deg, #17c8e6 0%, #4b7bff 60%, #7b5cff 100%);
    --grad-accent:  linear-gradient(90deg, #ff4d9d, #ff7a1a);

    --good: #12a150; --good-soft: #e4f8ec;
    --bad: #e5194b; --bad-soft: #ffe6ec;
    --warn: #d98a00; --warn-soft: #fff3d6;

    --shadow: 0 2px 8px rgba(60,40,120,0.06), 0 18px 44px rgba(60,40,120,0.10);
    --shadow-sm: 0 1px 4px rgba(60,40,120,0.08);
    --shadow-color: 0 12px 30px rgba(122,60,255,0.30);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1100px 520px at 0% -10%, rgba(122,92,255,0.18), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(255,77,157,0.14), transparent 55%),
      radial-gradient(800px 600px at 60% 120%, rgba(18,194,233,0.12), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    padding-inline: 22px; padding-block: 30px;
    min-height: 100%;
  }
  .wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
  .title-blk .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
    background: var(--grad-accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .title-blk h1 { font-size: 28px; margin: 5px 0 0; letter-spacing: -0.025em; }
  .title-blk .sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .cmp-seg { display: inline-flex; background: var(--surface); border-radius: 12px; padding: 4px; box-shadow: var(--shadow-sm); gap: 2px; }
  .cmp-seg button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 9px;
    background: transparent; color: var(--ink-2); cursor: pointer; transition: all .2s; }
  .cmp-seg button.on { background: var(--violet); color: #fff; box-shadow: 0 4px 12px rgba(106,75,255,0.35); }

  /* ===== BENTO ===== */
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; grid-auto-flow: row dense; }
  @media (max-width: 860px) { .bento { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .bento { grid-template-columns: 1fr; } }

  .tile { background: var(--surface); border-radius: 22px; padding: 20px; box-shadow: var(--shadow);
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    opacity: 0; transform: translateY(16px) scale(0.98); }
  .tile.in { animation: pop .55s cubic-bezier(.2,.8,.25,1) forwards; }
  @keyframes pop { to { opacity: 1; transform: none; } }

  .tile .t-label { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; opacity: 0.9; }
  .tile .t-value { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; margin-top: 6px; }
  .tile .t-foot { margin-top: auto; padding-top: 12px; font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .delta { font-weight: 800; display: inline-flex; align-items: center; gap: 3px; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); }
  .delta.up.oncolor, .delta.down.oncolor { color: #fff; }
  .foot-note { color: var(--ink-2); font-weight: 500; }

  /* tiles grandes coloridos */
  .tile.receita { grid-column: span 2; grid-row: span 2; background: var(--grad-receita); color: #fff; box-shadow: var(--shadow-color); }
  .tile.receita .t-label { opacity: 0.85; }
  .tile.receita .t-value { font-size: 52px; }
  .tile.receita .foot-note { color: rgba(255,255,255,0.85); }
  .tile.runway { grid-column: span 1; grid-row: span 2; background: var(--grad-runway); color: #fff; box-shadow: 0 12px 30px rgba(30,120,255,0.28); }
  .tile.runway .foot-note { color: rgba(255,255,255,0.85); }

  .tile .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: 0.25; pointer-events: none; }
  .tile.receita .blob { width: 220px; height: 220px; right: -60px; bottom: -70px; background: radial-gradient(circle, #fff, transparent 70%); }
  .tile.runway .blob { width: 160px; height: 160px; right: -50px; top: -40px; background: radial-gradient(circle, #fff, transparent 70%); }

  .spark { margin-top: 12px; }

  /* medidor de combustível (runway) */
  .fuel { margin-top: 14px; }
  .fuel .bar { height: 12px; border-radius: 8px; background: rgba(255,255,255,0.28); overflow: hidden; }
  .fuel .bar span { display: block; height: 100%; border-radius: 8px; width: 0;
    background: linear-gradient(90deg, #fff, rgba(255,255,255,0.7)); transition: width 1.1s cubic-bezier(.2,.8,.25,1); }
  .fuel .scale { display: flex; justify-content: space-between; font-size: 10px; margin-top: 5px; opacity: 0.8; }

  /* radial gauges nas margens */
  .gauge-tile { align-items: flex-start; }
  .gauge-wrap { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .gauge-wrap .g-num { display: flex; flex-direction: column; }
  .gauge-wrap .g-num .gv { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .gauge-wrap .g-num .gt { font-size: 11px; color: var(--ink-2); }

  .accent-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .tile .corner-icon { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 11px;
    display: grid; place-items: center; font-size: 17px; }

  /* trend full width */
  .tile.trend { grid-column: span 4; grid-row: span 1; }
  @media (max-width: 860px) { .tile.trend { grid-column: span 2; } }
  @media (max-width: 480px) { .tile.trend { grid-column: span 1; } }
  .trend-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .trend-legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
  .trend-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .ax { fill: var(--muted); font-size: 10.5px; }
  .grid-line { stroke: var(--hair-2); stroke-width: 1; }
  .chart-wrap { position: relative; overflow-x: auto; }
  .tooltip { position: absolute; pointer-events: none; background: var(--ink); color: #fff;
    font-size: 11.5px; padding: 8px 10px; border-radius: 9px; opacity: 0; transition: opacity .12s; white-space: nowrap; z-index: 9; line-height: 1.5; box-shadow: var(--shadow); }

  /* resumo do CFO */
  .cfo-summary { grid-column: span 4; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 860px) { .cfo-summary { grid-column: span 2; grid-template-columns: 1fr; } }
  @media (max-width: 480px) { .cfo-summary { grid-column: span 1; } }
  .sum-card { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: var(--shadow);
    border-left: 5px solid var(--muted); opacity: 0; transform: translateY(16px); }
  .sum-card.in { animation: pop .55s cubic-bezier(.2,.8,.25,1) forwards; }
  .sum-card.good { border-left-color: var(--good); }
  .sum-card.bad { border-left-color: var(--bad); }
  .sum-card.warn { border-left-color: var(--warn); }
  .sum-card .s-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 7px; }
  .sum-card.good .s-tag { color: var(--good); } .sum-card.bad .s-tag { color: var(--bad); } .sum-card.warn .s-tag { color: var(--warn); }
  .sum-card .s-head { font-size: 16px; font-weight: 700; margin: 10px 0 4px; letter-spacing: -0.01em; }
  .sum-card .s-body { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) {
    .tile, .sum-card { opacity: 1 !important; transform: none !important; animation: none !important; }
    .fuel .bar span { transition: none; }
  }
  footer.note { font-size: 11.5px; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="title-blk">
      <div class="eyebrow">Executive Cockpit</div>
      <h1 id="title">Cockpit do CFO</h1>
      <div class="sub" id="sub">Visão de uma página · comparando com o período selecionado</div>
    </div>
    <div class="cmp-seg" id="cmp">
      <button data-c="mom" class="on">vs mês anterior</button>
      <button data-c="qoq">vs trimestre</button>
      <button data-c="target">vs meta</button>
    </div>
  </div>

  <div class="bento" id="bento"></div>

  <footer class="note">Dados de exemplo de uma operação em crescimento. Substitua o array MONTHS e o objeto TARGET no script.</footer>
</div>

<script>
// ===== Dados de exemplo — troque por seus números =====
const MONTHS = [
  {m:"2025-10", receita:412, cmv:78, opex:266, impostos:31, caixa:4180},
  {m:"2025-11", receita:438, cmv:82, opex:271, impostos:34, caixa:4090},
  {m:"2025-12", receita:471, cmv:86, opex:276, impostos:39, caixa:3995},
  {m:"2026-01", receita:459, cmv:90, opex:281, impostos:34, caixa:3880},
  {m:"2026-02", receita:483, cmv:89, opex:285, impostos:38, caixa:3790},
  {m:"2026-03", receita:512, cmv:94, opex:290, impostos:43, caixa:3705},
  {m:"2026-04", receita:534, cmv:97, opex:296, impostos:46, caixa:3640},
  {m:"2026-05", receita:558, cmv:101, opex:302, impostos:49, caixa:3560},
  {m:"2026-06", receita:571, cmv:104, opex:308, impostos:50, caixa:3505},
  {m:"2026-07", receita:596, cmv:107, opex:314, impostos:54, caixa:3430},
  {m:"2026-08", receita:618, cmv:110, opex:320, impostos:57, caixa:3355},
  {m:"2026-09", receita:647, cmv:113, opex:326, impostos:62, caixa:3300},
];
// valores em milhares (k). Metas:
const TARGET = { receita:640, margemBruta:0.82, margemLiq:0.28, runway:30, caixa:3200, burn:80 };

function derive(d){
  const lucroBruto=d.receita-d.cmv;
  const lucroOp=lucroBruto-d.opex;
  const lucroLiq=lucroOp-d.impostos;
  return {...d, lucroBruto, lucroOp, lucroLiq, margemBruta:lucroBruto/d.receita, margemLiq:lucroLiq/d.receita};
}
const DATA = MONTHS.map(derive);
const MONTHS_PT={"01":"Jan","02":"Fev","03":"Mar","04":"Abr","05":"Mai","06":"Jun","07":"Jul","08":"Ago","09":"Set","10":"Out","11":"Nov","12":"Dez"};
function mLabel(k){ const [y,m]=k.split("-"); return (MONTHS_PT[m]||m)+"/"+y.slice(2); }
function cvar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function rk(v){ // R$ em k/M
  const a=Math.abs(v), s=v<0?"-":"";
  if(a>=1000) return s+"R$ "+(a/1000).toFixed(2)+"M";
  return s+"R$ "+a.toFixed(0)+"k";
}
function pct1(v){ return (v*100).toFixed(1)+"%"; }

const cur = DATA[DATA.length-1];
const prevM = DATA[DATA.length-2];
const prevQ = DATA[DATA.length-4]; // 3 meses atrás
const burnRate = Math.round((DATA[DATA.length-4].caixa - cur.caixa)/3); // média queima 3m (k/mês)
const runway = burnRate>0 ? cur.caixa/burnRate : Infinity;
const crescimento = (cur.receita-prevM.receita)/prevM.receita;

let cmpMode="mom";

function baseFor(key){
  if(cmpMode==="mom") return prevM;
  if(cmpMode==="qoq") return prevQ;
  return null; // target tratado à parte
}
function cmpLabel(){ return cmpMode==="mom"?"mês anterior":cmpMode==="qoq"?"trimestre":"meta"; }

function deltaHTML(curVal, key, {invert=false, oncolor=false, isPct=false, targetVal=null}={}){
  let base;
  if(cmpMode==="target"){ base = targetVal; }
  else { const b=baseFor(key); base = b? b[key] : undefined; }
  if(base===undefined || base===null || base===0) return `<span class="foot-note ${oncolor?'':''}" style="${oncolor?'color:rgba(255,255,255,.8)':''}">—</span>`;
  const diff=curVal-base; const p=diff/Math.abs(base);
  const good = invert? diff<0 : diff>0;
  const cls = diff===0?"":(good?"up":"down");
  const arrow = diff>0?"▲":diff<0?"▼":"—";
  const shown = isPct? (Math.abs(diff)*100).toFixed(1)+" p.p." : Math.abs(p*100).toFixed(1)+"%";
  return `<span class="delta ${cls} ${oncolor?'oncolor':''}">${arrow} ${shown}</span> <span class="foot-note" style="${oncolor?'color:rgba(255,255,255,.8)':''}">vs ${cmpLabel()}</span>`;
}

function sparkline(key, stroke){
  const W=260,H=48,p=4;
  const vals=DATA.map(d=>d[key]);
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const x=i=>p+(i/(vals.length-1))*(W-2*p);
  const y=v=>H-p-((v-mn)/r)*(H-2*p);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const area=`M${x(0)},${H} `+vals.map((v,i)=>`L${x(i)},${y(v)}`).join(" ")+` L${x(vals.length-1)},${H} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="sg-${key}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${stroke}" stop-opacity="0.35"/><stop offset="100%" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sg-${key})"/>
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function radialGauge(id, frac, color){
  const R=30, C=2*Math.PI*R;
  return `<svg viewBox="0 0 76 76" width="76" height="76">
    <circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--hair)" stroke-width="9"/>
    <circle id="${id}" cx="38" cy="38" r="${R}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
      transform="rotate(-90 38 38)" stroke-dasharray="0 ${C}" data-target="${(C*Math.min(1,frac)).toFixed(2)}" data-c="${C.toFixed(2)}"/>
  </svg>`;
}

function buildBento(){
  const bento=document.getElementById("bento");
  const runwayFrac = runway===Infinity? 1 : Math.min(1, runway/ (TARGET.runway*1.5));
  const tiles = [];

  // Receita (grande, colorido)
  tiles.push(`<div class="tile receita">
    <div class="blob"></div>
    <div class="t-label">Receita mensal</div>
    <div class="t-value"><span data-count="${cur.receita}" data-fmt="rk">R$ 0</span></div>
    <div class="t-foot">${deltaHTML(cur.receita,"receita",{oncolor:true, targetVal:TARGET.receita})}</div>
    ${sparkline("receita","rgba(255,255,255,0.9)")}
  </div>`);

  // Runway (tall, colorido)
  tiles.push(`<div class="tile runway">
    <div class="blob"></div>
    <div class="t-label">Runway</div>
    <div class="t-value">${runway===Infinity?'∞':'<span data-count="'+runway.toFixed(1)+'" data-fmt="months">0</span>'}</div>
    <div class="foot-note" style="color:rgba(255,255,255,.85);font-size:12px;margin-top:2px">meses no caixa atual</div>
    <div class="fuel">
      <div class="bar"><span data-w="${(runwayFrac*100).toFixed(0)}"></span></div>
      <div class="scale"><span>0</span><span>meta ${TARGET.runway}m</span></div>
    </div>
    <div class="t-foot">${cmpMode==="target"?deltaHTML(runway,"__",{targetVal:TARGET.runway}):`<span class="foot-note" style="color:rgba(255,255,255,.85)">queima R$ ${burnRate}k/mês</span>`}</div>
  </div>`);

  // Caixa
  tiles.push(`<div class="tile">
    <div class="corner-icon" style="background:var(--cyan);color:#fff">◆</div>
    <div class="t-label" style="color:var(--ink-2)">Caixa</div>
    <div class="t-value" style="color:var(--cyan)"><span data-count="${cur.caixa}" data-fmt="rk">R$ 0</span></div>
    <div class="t-foot">${deltaHTML(cur.caixa,"caixa",{targetVal:TARGET.caixa})}</div>
  </div>`);

  // Burn rate
  tiles.push(`<div class="tile">
    <div class="corner-icon" style="background:var(--orange);color:#fff">🔥</div>
    <div class="t-label" style="color:var(--ink-2)">Taxa de queima</div>
    <div class="t-value" style="color:var(--orange)"><span data-count="${burnRate}" data-fmt="rk">R$ 0</span></div>
    <div class="t-foot"><span class="foot-note">líquido de caixa/mês</span></div>
  </div>`);

  // Margem bruta (gauge)
  tiles.push(`<div class="tile gauge-tile">
    <div class="t-label" style="color:var(--ink-2)"><span class="accent-dot" style="background:var(--violet)"></span> Margem bruta</div>
    <div class="gauge-wrap">
      ${radialGauge("g-bruta", cur.margemBruta, cvar('--violet'))}
      <div class="g-num"><span class="gv" style="color:var(--violet)">${pct1(cur.margemBruta)}</span><span class="gt">meta ${pct1(TARGET.margemBruta)}</span></div>
    </div>
    <div class="t-foot">${deltaHTML(cur.margemBruta,"margemBruta",{isPct:true, targetVal:TARGET.margemBruta})}</div>
  </div>`);

  // Margem líquida (gauge)
  tiles.push(`<div class="tile gauge-tile">
    <div class="t-label" style="color:var(--ink-2)"><span class="accent-dot" style="background:var(--lime)"></span> Margem líquida</div>
    <div class="gauge-wrap">
      ${radialGauge("g-liq", cur.margemLiq, cvar('--lime'))}
      <div class="g-num"><span class="gv" style="color:var(--lime)">${pct1(cur.margemLiq)}</span><span class="gt">meta ${pct1(TARGET.margemLiq)}</span></div>
    </div>
    <div class="t-foot">${deltaHTML(cur.margemLiq,"margemLiq",{isPct:true, targetVal:TARGET.margemLiq})}</div>
  </div>`);

  // Lucro líquido
  tiles.push(`<div class="tile">
    <div class="corner-icon" style="background:var(--lime);color:#fff">↑</div>
    <div class="t-label" style="color:var(--ink-2)">Lucro líquido</div>
    <div class="t-value" style="color:var(--lime)"><span data-count="${cur.lucroLiq}" data-fmt="rk">R$ 0</span></div>
    <div class="t-foot">${deltaHTML(cur.lucroLiq,"lucroLiq",{})}</div>
  </div>`);

  // Opex
  tiles.push(`<div class="tile">
    <div class="corner-icon" style="background:var(--magenta);color:#fff">≡</div>
    <div class="t-label" style="color:var(--ink-2)">Despesas operacionais</div>
    <div class="t-value" style="color:var(--magenta)"><span data-count="${cur.opex}" data-fmt="rk">R$ 0</span></div>
    <div class="t-foot">${deltaHTML(cur.opex,"opex",{invert:true})}</div>
  </div>`);

  // Trend (full)
  tiles.push(`<div class="tile trend">
    <div class="trend-head">
      <div style="font-size:14px;font-weight:700">Receita, lucro líquido & caixa — 12 meses</div>
      <div class="trend-legend">
        <span><span class="dot" style="background:var(--violet)"></span>Receita</span>
        <span><span class="dot" style="background:var(--lime)"></span>Lucro líquido</span>
        <span><span class="dot" style="background:var(--cyan)"></span>Caixa (÷10)</span>
      </div>
    </div>
    <div class="chart-wrap">
      <svg id="trend-chart" viewBox="0 0 1100 260" style="width:100%;height:auto;display:block"></svg>
      <div class="tooltip" id="trend-tt"></div>
    </div>
  </div>`);

  // Resumo do CFO (3 pontos)
  tiles.push(`<div class="cfo-summary" id="cfo-summary"></div>`);

  bento.innerHTML = tiles.join("");
}

function renderTrend(){
  const svg=document.getElementById("trend-chart");
  const W=1100,H=260,padL=54,padR=16,padT=18,padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const rec=DATA.map(d=>d.receita), luc=DATA.map(d=>d.lucroLiq), cxa=DATA.map(d=>d.caixa/10);
  const allV=[...rec,...luc,...cxa];
  const mn=Math.min(0,...allV), mx=Math.max(...allV), range=mx-mn||1;
  const x=i=>padL+(i/(DATA.length-1))*plotW;
  const y=v=>padT+plotH-((v-mn)/range)*plotH;
  let s="";
  for(let i=0;i<=4;i++){ const gy=padT+(plotH/4)*i; s+=`<line class="grid-line" x1="${padL}" x2="${W-padR}" y1="${gy}" y2="${gy}"/>`; }
  DATA.forEach((d,i)=>{ if(i%2===0||i===DATA.length-1) s+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${mLabel(d.m)}</text>`; });
  function series(arr,color,id,fill){
    const pts=arr.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    let out="";
    if(fill){ const area=`M${x(0)},${y(mn)} `+arr.map((v,i)=>`L${x(i)},${y(v)}`).join(" ")+` L${x(arr.length-1)},${y(mn)} Z`;
      out+=`<defs><linearGradient id="tg-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
      out+=`<path d="${area}" fill="url(#tg-${id})"/>`; }
    out+=`<polyline class="tline" id="${id}" points="${pts}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
    return out;
  }
  s+=series(rec,cvar('--violet'),"l-rec",true);
  s+=series(cxa,cvar('--cyan'),"l-cxa",false);
  s+=series(luc,cvar('--lime'),"l-luc",false);
  DATA.forEach((d,i)=>{ s+=`<circle class="tpt" data-i="${i}" cx="${x(i)}" cy="${y(d.receita)}" r="9" fill="transparent"/>`; });
  svg.innerHTML=s;

  // animação traço
  if(!REDUCE){
    svg.querySelectorAll(".tline").forEach((el,k)=>{
      const len=el.getTotalLength();
      el.style.strokeDasharray=len; el.style.strokeDashoffset=len; el.style.transition="none";
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transition=`stroke-dashoffset 1.2s ease ${0.15+k*0.2}s`; el.style.strokeDashoffset="0"; }));
    });
  }
  const tt=document.getElementById("trend-tt");
  svg.querySelectorAll(".tpt").forEach(el=>{
    el.addEventListener("mouseenter",()=>{
      const d=DATA[+el.dataset.i];
      tt.innerHTML=`<b>${mLabel(d.m)}</b><br>Receita: ${rk(d.receita)}<br>Lucro: ${rk(d.lucroLiq)}<br>Caixa: ${rk(d.caixa)}`;
      tt.style.opacity=1;
      const r=svg.getBoundingClientRect(), wr=svg.parentElement.getBoundingClientRect();
      tt.style.left=(r.left-wr.left+(+el.getAttribute("cx"))*(r.width/W))+"px";
      tt.style.top=(r.top-wr.top+(+el.getAttribute("cy"))*(r.height/H)-64)+"px";
    });
    el.addEventListener("mouseleave",()=>tt.style.opacity=0);
  });
}

function renderCFOSummary(){
  // gera 3 pontos a partir dos dados
  const movers=[
    {label:"Receita", diff:(cur.receita-prevM.receita)/prevM.receita, kind:"up-good"},
    {label:"Lucro líquido", diff:(cur.lucroLiq-prevM.lucroLiq)/Math.abs(prevM.lucroLiq||1), kind:"up-good"},
    {label:"Margem líquida", diff:(cur.margemLiq-prevM.margemLiq), kind:"up-good"},
    {label:"Despesas operacionais", diff:(cur.opex-prevM.opex)/prevM.opex, kind:"down-good"},
    {label:"Caixa", diff:(cur.caixa-prevM.caixa)/prevM.caixa, kind:"up-good"},
  ];
  // melhor: maior movimento favorável
  const scored=movers.map(m=>({...m, fav: m.kind==="down-good"? -m.diff : m.diff }));
  const best=[...scored].sort((a,b)=>b.fav-a.fav)[0];
  const worst=[...scored].sort((a,b)=>a.fav-b.fav)[0];
  // atenção: runway ou margem abaixo da meta
  let attention;
  if(runway < TARGET.runway) attention={head:`Runway em ${runway.toFixed(0)} meses`, body:`Abaixo da meta de ${TARGET.runway} meses. Queima de R$ ${burnRate}k/mês reduz o caixa de forma constante — avaliar ritmo de investimento.`};
  else if(cur.margemLiq < TARGET.margemLiq) attention={head:`Margem líquida ${pct1(cur.margemLiq)}`, body:`Ainda ${((TARGET.margemLiq-cur.margemLiq)*100).toFixed(1)} p.p. abaixo da meta de ${pct1(TARGET.margemLiq)}. Alavancar receita sobre a base de custos atual.`};
  else attention={head:`Caixa em ${rk(cur.caixa)}`, body:`Monitorar o ritmo de queima frente ao plano de contratação do próximo trimestre.`};

  const favTxt = (m)=> (m.diff>=0?"+":"")+(Math.abs(m.diff)<1? (m.diff*100).toFixed(1)+ (m.label.includes("Margem")?" p.p.":"%") : (m.diff*100).toFixed(0)+"%");
  const html=`
    <div class="sum-card good">
      <div class="s-tag">▲ O que melhorou</div>
      <div class="s-head">${best.label} ${favTxt(best)}</div>
      <div class="s-body">Maior avanço favorável no mês. ${best.label==="Receita"?`Receita chegou a ${rk(cur.receita)}, crescimento de ${pct1(crescimento)} sobre o mês anterior.`:`Movimento que puxou o resultado para cima.`}</div>
    </div>
    <div class="sum-card bad">
      <div class="s-tag">▼ O que piorou</div>
      <div class="s-head">${worst.label} ${favTxt(worst)}</div>
      <div class="s-body">Maior movimento desfavorável do período. Acompanhar de perto para não comprometer a margem.</div>
    </div>
    <div class="sum-card warn">
      <div class="s-tag">● Exige atenção</div>
      <div class="s-head">${attention.head}</div>
      <div class="s-body">${attention.body}</div>
    </div>`;
  document.getElementById("cfo-summary").innerHTML=html;
}

// ===== animações =====
function countUp(el, target, fmt, dur=1100){
  if(REDUCE){ el.textContent=fmt(target); return; }
  const start=performance.now();
  (function step(now){ const t=Math.min(1,(now-start)/dur); const e=1-Math.pow(1-t,3);
    el.textContent=fmt(target*e); if(t<1) requestAnimationFrame(step); else el.textContent=fmt(target); })(performance.now());
}
function fmtBy(kind){
  if(kind==="rk") return v=>rk(v);
  if(kind==="months") return v=>v.toFixed(1)+" meses";
  return v=>Math.round(v).toString();
}
function runAnimations(){
  // conta números
  document.querySelectorAll("[data-count]").forEach(el=>{
    countUp(el, +el.dataset.count, fmtBy(el.dataset.fmt));
  });
  // gauges radiais
  document.querySelectorAll("[data-target][data-c]").forEach((el,i)=>{
    const target=el.dataset.target, C=el.dataset.c;
    if(REDUCE){ el.setAttribute("stroke-dasharray", `${target} ${C}`); return; }
    el.setAttribute("stroke-dasharray", `0 ${C}`);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition=`stroke-dasharray 1.1s cubic-bezier(.2,.8,.25,1) ${0.2+i*0.1}s`;
      el.setAttribute("stroke-dasharray", `${target} ${C}`);
    }));
  });
  // barra de combustível
  document.querySelectorAll(".fuel .bar span").forEach(el=>{
    if(REDUCE){ el.style.width=el.dataset.w+"%"; return; }
    setTimeout(()=>{ el.style.width=el.dataset.w+"%"; }, 350);
  });
  // tiles pop (stagger) — dispara no load, sem depender de scroll
  const tiles=[...document.querySelectorAll(".tile")];
  tiles.forEach((el,i)=>{ if(!REDUCE) el.style.animationDelay=(i*70)+"ms"; el.classList.add("in"); });
  const sums=[...document.querySelectorAll(".sum-card")];
  sums.forEach((el,i)=>{ if(!REDUCE) el.style.animationDelay=(tiles.length*70 + i*90)+"ms"; el.classList.add("in"); });
}

function render(){
  document.getElementById("sub").textContent=`Visão de uma página · ${mLabel(cur.m)} · comparando com ${cmpLabel()}`;
  buildBento();
  renderTrend();
  renderCFOSummary();
  runAnimations();
}

document.querySelectorAll("#cmp button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#cmp button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); cmpMode=b.dataset.c; render();
  });
});
render();
</script>
