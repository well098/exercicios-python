<title>MAE Centro de Comando</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f5fa; --surface: #ffffff; --surface-2: #f7f8fc; --surface-3: #eef1f8;
    --ink: #0f1a33; --ink-2: #56607e; --muted: #98a0b8; --hair: #e7eaf2; --hair-2: #d8ddea;

    --crit: #e5484d; --crit-soft: #fdecec; --warn: #d9860a; --warn-soft: #fff3de;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100%; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  /* ---------- menu lateral ---------- */
  .side { background: var(--surface); border-right: 1px solid var(--hair); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 6px; }
  .brand .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--hero); color: #fff; font-weight: 900; display: grid; place-items: center; letter-spacing: -.04em; font-size: 15px; flex-shrink: 0; }

  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; text-align: left; color: var(--ink-2); font-weight: 600; font-size: 13.5px; width: 100%; }

  .nav-item .soon { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--muted); }
  .nav-item.ask { background: var(--mae-soft); color: var(--mae); margin: 4px 0; }

  @media (max-width: 900px) {

    .brand { padding: 0 6px 0 0; } .brand .tg, .brand .nm { display: none; }
    .nav-group { flex-direction: row; gap: 4px; } .nav-group .gl, .side-foot { display: none; }
    .nav-item { white-space: nowrap; width: auto; padding: 8px 10px; }

  /* ---------- área principal ---------- */

  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mae); margin-bottom: 6px; }

  .dot.ok { background: var(--good); } .dot.stale { background: var(--warn); } .dot.off { background: var(--hair-2); }

  /* sinal principal */

  .hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events: none; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .hero .lbl { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .8; display: flex; align-items: center; gap: 8px; }
  .hero .ttl { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 8px 0 12px; line-height: 1.2; text-wrap: balance; }
  .hero .why { display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; }
  .hero .why div { display: flex; gap: 9px; align-items: flex-start; opacity: .95; }
  .hero .why .b { width: 18px; height: 18px; border-radius: 6px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 10px; flex-shrink: 0; margin-top: 1px; }
  .hero .side-box { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .hero .imp-l { font-size: 11.5px; opacity: .8; }
  .hero .imp-v { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
  .hero .todo { font-size: 13.5px; line-height: 1.45; }
  .hero .conf { font-size: 11.5px; opacity: .85; }
  .hero .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .btn { border: 0; border-radius: 11px; padding: 9px 14px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform .1s, background .15s, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn.w { background: #fff; color: var(--ink); } .btn.wg { background: rgba(255,255,255,.14); color: #fff; }
  .btn.p { background: var(--accent); color: #fff; } .btn.p:hover { background: #2f40e6; }
  .btn.g { background: var(--good); color: #fff; } .btn.r { background: var(--surface-3); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
  .btn.sm { padding: 7px 11px; font-size: 12.5px; }

  /* fila de sinais */
  .sig { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; }
  .sig:hover { background: var(--surface-2); }
  .sig .bar { width: 4px; height: 100%; min-height: 36px; border-radius: 4px; }
  .sig .st { font-weight: 700; font-size: 13.5px; }
  .sig .sd { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .sig .src-tag { font-size: 10.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .sig .go { font-size: 12px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .sev-crit { background: var(--crit); } .sev-warn { background: var(--warn); } .sev-info { background: var(--info); } .sev-good { background: var(--good); }
  .tag { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
  .tag.crit { background: var(--crit-soft); color: var(--crit); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.info { background: var(--info-soft); color: var(--info); } .tag.good { background: var(--good-soft); color: var(--good); } .tag.mae { background: var(--mae-soft); color: var(--mae); }

  table.today tr:last-child td { border-bottom: 0; }
  table.today td:first-child { font-weight: 600; white-space: nowrap; } table.today td:last-child { text-align: right; color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .up { color: var(--good); font-weight: 800; } .down { color: var(--crit); font-weight: 800; }

  /* recomendações */

  @media (max-width: 420px) { .recs { grid-template-columns: 1fr; } }
  .rec { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: opacity .35s, transform .35s; }

  .rec .rh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rec .rt { font-weight: 800; font-size: 14.5px; letter-spacing: -.01em; line-height: 1.3; }
  .rec ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; line-height: 1.6; }
  .rec .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .rec .meta b { color: var(--ink); }
  .rec .draft { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; border-left: 3px solid var(--mae); }
  .rec .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: auto; }
  .reject-box { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px; }
  .reject-box select { background: var(--surface); border: 1px solid var(--hair-2); border-radius: 9px; padding: 7px 9px; }

  /* ciclo */
  .cycle { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); }
  .cycle span { padding: 4px 10px; border-radius: 999px; background: var(--surface-3); font-weight: 700; }
  .cycle span.hl { background: var(--mae-soft); color: var(--mae); }
  .timeline { display: flex; flex-direction: column; gap: 10px; }
  .tl { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 13px; }
  .tl .ti { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; color: #fff; }
  .tl .tt { font-weight: 700; } .tl .td { color: var(--ink-2); font-size: 12px; margin-top: 2px; }

  /* tabelas de lista */
  .tbl-wrap { overflow-x: auto; }
  table.list { width: 100%; border-collapse: collapse; min-width: 640px; }
  table.list th { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 8px; border-bottom: 2px solid var(--hair-2); }
  table.list td { padding: 11px 8px; border-bottom: 1px solid var(--hair); font-size: 13px; vertical-align: middle; }
  table.list th.n, table.list td.n { text-align: right; }
  table.list tbody tr { cursor: pointer; } table.list tbody tr:hover td { background: var(--surface-2); }
  .search { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search input { flex: 1; min-width: 200px; background: var(--surface); border: 1px solid var(--hair-2); border-radius: 12px; padding: 11px 14px; font-size: 14px; }
  .chips { display: inline-flex; gap: 4px; background: var(--surface); border-radius: 11px; padding: 3px; box-shadow: var(--shadow-sm); }
  .chips button { border: 0; background: transparent; padding: 7px 11px; border-radius: 8px; font-weight: 700; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .chips button.on { background: var(--accent); color: #fff; }

  /* gaveta */
  .backdrop { position: fixed; inset: 0; background: rgba(15,26,51,.3); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(620px, 100%); background: var(--surface); z-index: 51; box-shadow: -20px 0 50px rgba(15,26,51,.18); transform: translateX(104%); transition: transform .3s cubic-bezier(.2,.8,.25,1); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .drawer.open { transform: none; }
  .drawer .dh { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 20px 22px 14px; border-bottom: 1px solid var(--hair); }
  .drawer .dh h3 { margin: 0; font-size: 19px; letter-spacing: -.02em; } .drawer .dh p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }

  .sec-t { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .perceived { background: var(--mae-soft); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; }
  .perceived .pt { font-weight: 800; color: var(--mae); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .perceived div { display: flex; gap: 8px; } .perceived div::before { content: "•"; color: var(--mae); font-weight: 900; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--surface-2); border-radius: 12px; padding: 11px; } .kpi .kl { font-size: 11px; color: var(--ink-2); } .kpi .kv { font-size: 17px; font-weight: 800; margin-top: 3px; }

  .conv .cm { font-size: 13.5px; line-height: 1.5; } .conv .ct { display: flex; gap: 5px; flex-wrap: wrap; }
  .ev { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--hair); }
  .ev:last-child { border-bottom: 0; }
  .ev .ei { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-3); display: grid; place-items: center; font-size: 13px; }
  .ev .et { font-weight: 700; font-size: 13px; } .ev .ed { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.5; }
  .note { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 11px 13px; line-height: 1.55; }
  .note b { color: var(--ink); }

  /* pergunte */
  .ask-box { display: flex; gap: 10px; }
  .ask-box input { flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--mae); border-radius: 14px; padding: 13px 16px; font-size: 15px; }
  .sugs { display: flex; gap: 8px; flex-wrap: wrap; }
  .sug { border: 1px solid var(--hair-2); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); text-align: left; }
  .sug:hover { border-color: var(--mae); color: var(--mae); }
  .answer { display: flex; flex-direction: column; gap: 12px; }
  .answer .q { font-weight: 800; font-size: 15px; }
  .answer .a { font-size: 14px; line-height: 1.6; }
  .answer .srcs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); }

  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .ax { fill: var(--muted); font-size: 10.5px; }

  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; transition: all .25s; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { color: var(--muted); font-size: 13px; padding: 16px 4px; }
  .demo-flag { font-size: 11px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 3px 8px; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1 !important; transform: none !important; animation: none !important; } .drawer, .rec, .toast { transition: none; } .dot.live { animation: none; } }
</style>

<div class="app">

  <main class="main"><div class="view" id="view"></div></main>
</div>

<script>

/* ================= utilidades ================= */
const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const num = (v, dd = 0) => Number(v).toFixed(dd).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const brl = v => { const a = Math.abs(v), s = v < 0 ? "−" : ""; if (a >= 1e6) return s + "R$ " + (a / 1e6).toFixed(2).replace(".", ",") + "M"; if (a >= 1e3) return s + "R$ " + (a / 1e3).toFixed(1).replace(".", ",") + " mil"; return s + "R$ " + num(a); };
const brlFull = v => (v < 0 ? "−R$ " : "R$ ") + num(Math.abs(Math.round(v)));
const pct = (v, dd = 1) => (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(dd).replace(".", ",") + "%";
const dia = dt => String(dt.getDate()).padStart(2, "0") + "/" + String(dt.getMonth() + 1).padStart(2, "0");
const diasAte = dt => Math.round((dt - HOJE) / 864e5);
const diasDesde = dt => Math.round((HOJE - dt) / 864e5);
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => sum(a) / a.length;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const byId = (arr, id) => arr.find(x => x.id === id);
function spark(vals, color, w = 110, h = 30){
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const x = i => 2 + i / (vals.length - 1) * (w - 4), y = v => h - 3 - (v - mn) / r * (h - 6);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block"><polyline points="${vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="2.6" fill="${color}"/></svg>`;
}
function bars(vals, labels, color, hi){
  const W = 560, H = 160, pl = 50, pb = 22, pt = 14, pw = W - pl - 8, ph = H - pb - pt, mx = Math.max(...vals) * 1.12 || 1, bw = pw / vals.length * .58;
  let s = ""; for (let k = 0; k <= 3; k++) { const gv = mx * k / 3, gy = pt + ph - gv / mx * ph; s += `<line x1="${pl}" x2="${W - 8}" y1="${gy}" y2="${gy}" stroke="var(--hair)"/><text class="ax" x="${pl - 6}" y="${gy + 3}" text-anchor="end">${brl(gv).replace("R$ ", "")}</text>`; }
  vals.forEach((v, i) => { const cx = pl + pw / vals.length * (i + .5), h = v / mx * ph; s += `<rect x="${cx - bw / 2}" y="${pt + ph - h}" width="${bw}" height="${h}" rx="4" fill="${i >= hi ? color : "var(--hair-2)"}"><title>${labels[i]}: ${brlFull(v)}</title></rect><text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

/* ================= ANÁLISE (sinais calculados dos dados) ================= */
const A = (() => {
  const totMes = MESES.map((_, i) => sum(CLIENTES.map(c => c.rec[i])));
  const fatAtual = totMes[5], fatAnt = totMes[4], varMes = (fatAtual - fatAnt) / fatAnt;
  const contrib = CLIENTES.map(c => ({ c, v: c.rec[5] - c.rec[4] })).sort((a, b) => b.v - a.v);
  const top4 = contrib.slice(0, 4), top4v = sum(top4.map(x => x.v));
  const ativos = CLIENTES.filter(c => diasDesde(c.ult) <= 30).length;
  const ticket = fatAtual / CLIENTES.length;
  const conc = [...CLIENTES].sort((a, b) => b.rec[5] - a.rec[5]).slice(0, 3); const concPct = sum(conc.map(c => c.rec[5])) / fatAtual;

  // clientes importantes reduzindo: média Ago-Set 20% abaixo da média Abr-Jul, entre os de maior receita
  const reduz = CLIENTES.map(c => { const base = avg(c.rec.slice(0, 4)), rec = avg(c.rec.slice(4)); return { c, base, rec, var: (rec - base) / base, perda: base - rec }; })
    .filter(x => x.var <= -0.2 && x.base >= 15000).sort((a, b) => b.perda - a.perda);
  const reduzPerda = sum(reduz.map(x => x.perda));
  const reduzPreco = reduz.filter(x => x.c.conv.some(m => m.tags.includes("preço")));
  const reduzConc = reduz.filter(x => x.c.conv.some(m => m.tags.includes("concorrente")));

  const contratos = CLIENTES.filter(c => c.contrato && diasAte(c.contrato) >= 0 && diasAte(c.contrato) <= 30).sort((a, b) => a.contrato - b.contrato);
  const contratosValor = sum(contratos.map(c => c.rec[5] * 12));

  const convs = CLIENTES.flatMap(c => c.conv.map(m => ({ ...m, c })));
  const semana = convs.filter(m => diasDesde(m.dt) <= 7);
  const recl = semana.filter(m => m.tags.includes("reclamação"));
  const reclAtraso = recl.filter(m => m.tema === "atraso");
  const reclMes = convs.filter(m => m.tags.includes("reclamação") && diasDesde(m.dt) <= 30).length;

  const reajustes = FORNECEDORES.map(f => { let n = 0; for (let i = 1; i < f.preco.length; i++) if (f.preco[i] > f.preco[i - 1]) n++;
    const rec60 = f.preco[7] > f.preco[5]; return { f, n, alta: f.preco[7] / f.preco[0] - 1, rec60 }; });
  const reajRec = reajustes.filter(r => r.rec60);
  const reajMulti = reajustes.filter(r => r.n >= 3).sort((a, b) => b.n - a.n);
  const atrasoForn = FORNECEDORES.filter(f => f.atrasos >= 4);

  const prods = PRODUTOS.map(p => { const base = avg(p.qtd.slice(2, 5)), v = (p.qtd[5] - base) / base;
    const mencPreco = convs.filter(m => m.prod === p.id && m.tags.includes("preço")).length; const mencConc = convs.filter(m => m.prod === p.id && m.tags.includes("concorrente")).length;
    return { p, v, mencPreco, mencConc }; });
  // prioriza quedas que têm explicação nas conversas (menções), depois a maior queda
  const prodQueda = prods.filter(x => x.v <= -0.1).sort((a, b) => (b.mencPreco + b.mencConc) - (a.mencPreco + a.mencConc) || a.v - b.v);
  const prodAlta = prods.filter(x => x.v >= 0.08).sort((a, b) => b.v - a.v);

  const oport = convs.filter(m => m.tags.includes("oportunidade") && diasDesde(m.dt) <= 14);
  const oportValor = sum(oport.map(m => m.valor || 0));
  const precoMenc = convs.filter(m => m.tags.includes("preço") && diasDesde(m.dt) <= 30).length;
  const precoMencAnt = 3; // mês anterior (histórico agregado)
  return { totMes, fatAtual, fatAnt, varMes, contrib, top4, top4v, ativos, ticket, conc, concPct, reduz, reduzPerda, reduzPreco, reduzConc, contratos, contratosValor,
    convs, semana, recl, reclAtraso, reclMes, reajustes, reajRec, reajMulti, atrasoForn, prods, prodQueda, prodAlta, oport, oportValor, precoMenc, precoMencAnt };
})();

  if (A.reajMulti.length) { const r = A.reajMulti[0]; S.push({ id: "s-forn", sev: "warn", area: "fornecedores", fontes: ["Compras e fornecedores"],

  const op = A.oport.slice().sort((a, b) => (b.valor || 0) - (a.valor || 0))[0];
  if (op) R.push({ id: "r-op-" + op.c.id, tipo: "proposta", alvo: op.c.id, sig: "s-oport", t: `Enviar proposta de volume para ${op.c.nome}`,

  const p = A.prodQueda[0];
  if (p) R.push({ id: "r-pr-" + p.p.id, tipo: "preco", alvo: p.p.id, sig: "s-prod", t: `Revisar preço e margem do ${p.p.nome}`,

  return R;
}

function renderNav(){

function go(r){ ROUTE = r; try { history.replaceState(null, "", "#" + r); } catch (e) {} closeDrawer(); render(); document.querySelector(".main").scrollTo?.(0, 0); window.scrollTo(0, 0); }

/* ================= GAVETA ================= */
function openDrawer(t, s, html){
  document.getElementById("dr-t").textContent = t; document.getElementById("dr-s").textContent = s;
  document.getElementById("dr-b").innerHTML = html; document.getElementById("dr-b").scrollTop = 0;
  document.getElementById("drawer").classList.add("open"); document.getElementById("drawer").setAttribute("aria-hidden", "false");
  document.getElementById("backdrop").classList.add("open"); document.getElementById("dr-x").focus();
  wire(document.getElementById("dr-b"));
}
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer").setAttribute("aria-hidden", "true"); document.getElementById("backdrop").classList.remove("open"); }
document.getElementById("dr-x").addEventListener("click", closeDrawer);
document.getElementById("backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// ações declarativas: data-act="cliente:c1", "evid:s-reduz", "go:clientes", "approve:id", "reject:id", ...
function wire(root){
  root.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", ev => {
    ev.stopPropagation(); const [a, arg] = el.dataset.act.split(":");
    if (a === "go") go(arg);
    else if (a === "cliente") openCliente(arg);
    else if (a === "forn") openFornecedor(arg);
    else if (a === "prod") openProduto(arg);
    else if (a === "evid") openEvidencias(arg);
    else if (a === "rec") openRec(arg);
    else if (a === "approve") approve(arg, el);
    else if (a === "reject") showReject(arg, el);
    else if (a === "execute") execute(arg);
    else if (a === "result") recordResult(arg, el.dataset.res);
    else if (a === "ask") ask(decodeURIComponent(arg));
  }));
}

/* ================= DETALHES ================= */
function convHTML(m, showCliente){
  return `<div class="conv"><div class="ch"><span>${showCliente ? `<b style="color:var(--ink)">${esc(m.c.nome)}</b> · ` : ""}WhatsApp · ${dia(m.dt)}</span><span>${m.c ? "cliente identificado" : ""}</span></div>
    <div class="cm">"${esc(m.txt)}"</div><div class="ct">${m.tags.map(t => `<span class="tag ${t === "reclamação" ? "crit" : t === "preço" || t === "concorrente" ? "warn" : t === "oportunidade" || t === "elogio" ? "good" : ""}">${t}</span>`).join("")}</div></div>`;
}
function perceivedCliente(c){
  const out = []; const base = avg(c.rec.slice(0, 4)), rec = avg(c.rec.slice(4)), v = (rec - base) / base;
  if (v <= -0.15) out.push(`Reduziu compras: média de ago–set ${pct(v, 0)} em relação a abr–jul (${brl(base - rec)}/mês a menos).`);
  if (v >= 0.15) out.push(`Está crescendo: média de ago–set ${pct(v, 0)} em relação a abr–jul.`);
  const pr = c.conv.filter(m => m.tags.includes("preço")).length; if (pr) out.push(`Mencionou preço em ${pr} conversa${pr > 1 ? "s" : ""} recente${pr > 1 ? "s" : ""}.`);
  const co = c.conv.filter(m => m.tags.includes("concorrente")).length; if (co) out.push(`Citou concorrente ${co} vez${co > 1 ? "es" : ""}.`);
  const rc = c.conv.filter(m => m.tags.includes("reclamação")); if (rc.length) out.push(`${rc.length} ${rc.length > 1 ? "reclamações recentes" : "reclamação recente"}${rc.some(m => m.tema === "atraso") ? ", sobre atraso na entrega" : ""}.`);
  const op = c.conv.filter(m => m.tags.includes("oportunidade")); if (op.length) out.push(`Pediu orçamento: potencial de ${brl(sum(op.map(m => m.valor || 0)))}.`);
  if (c.contrato && diasAte(c.contrato) <= 30 && diasAte(c.contrato) >= 0) out.push(`Contrato vence em ${diasAte(c.contrato)} dias (${dia(c.contrato)}).`);
  if (diasDesde(c.ult) > 7 && v < 0) out.push(`Último pedido há ${diasDesde(c.ult)} dias.`);
  return out.length ? out : ["Relacionamento estável: sem variação relevante de compras nem alertas nas conversas."];
}

  if (f.part >= 0.45 && f.part < 1) perc.push(`Representa ${Math.round(f.part * 100)}% das compras de ${f.cat.toLowerCase()}: dependência alta.`);

function evidenceList(sigId){
  const ev = [];
  if (sigId === "s-reduz") {
    A.reduz.forEach(x => ev.push({ i: "📉", t: `${x.c.nome}: ${pct(x.var, 0)}`, d: `média abr–jul ${brl(x.base)} → ago–set ${brl(x.rec)} (${brl(x.perda)}/mês a menos) · planilha de vendas` }));
    A.reduz.flatMap(x => x.c.conv.filter(m => m.tags.some(t => ["preço", "concorrente"].includes(t))).map(m => ({ ...m, c: x.c }))).forEach(m => ev.push({ i: "💬", t: `${m.c.nome} · ${dia(m.dt)}`, d: `"${m.txt}" · WhatsApp` }));
    ev.push({ i: "🧮", t: "Como o impacto foi calculado", d: `Soma, para os ${A.reduz.length} clientes, da diferença entre a média mensal de abr–jul e a de ago–set = ${brl(A.reduzPerda)}/mês. Não inclui margem nem sazonalidade.` });
  } else if (sigId === "s-contr") {
    A.contratos.forEach(c => ev.push({ i: "📄", t: `${c.nome}: vence em ${dia(c.contrato)}`, d: `${diasAte(c.contrato)} dias · compra ${brl(c.rec[5])}/mês · cadastro de clientes` }));
    ev.push({ i: "🧮", t: "Valor em jogo", d: `Receita do mês atual × 12 para os contratos listados = ${brl(A.contratosValor)}/ano.` });
  } else if (sigId === "s-recl") {
    A.recl.forEach(m => ev.push({ i: "💬", t: `${m.c.nome} · ${dia(m.dt)}`, d: `"${m.txt}"` }));
    A.atrasoForn.forEach(f => ev.push({ i: "🚚", t: `${f.nome}: ${f.atrasos} atrasos em 60 dias`, d: "planilha de compras e fornecedores" }));
  } else if (sigId === "s-forn") {
    const r = A.reajMulti[0]; const lb = ["Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set"];
    for (let i = 1; i < 8; i++) if (r.f.preco[i] > r.f.preco[i - 1]) ev.push({ i: "🏷", t: `Reajuste em ${lb[i]}`, d: `índice ${r.f.preco[i - 1]} → ${r.f.preco[i]} (${pct(r.f.preco[i] / r.f.preco[i - 1] - 1, 1)})` });
    ev.push({ i: "📊", t: "Concentração", d: `${Math.round(r.f.part * 100)}% das compras de ${r.f.cat.toLowerCase()}` });
  } else if (sigId === "s-prod") {
    const x = A.prodQueda[0]; ev.push({ i: "📉", t: `${x.p.nome}: ${pct(x.v, 0)}`, d: `setembro ${num(x.p.qtd[5])} un. vs média jun–ago ${num(avg(x.p.qtd.slice(2, 5)))} un.` });
    A.convs.filter(m => m.prod === x.p.id).forEach(m => ev.push({ i: "💬", t: `${m.c.nome} · ${dia(m.dt)}`, d: `"${m.txt}"` }));
  } else if (sigId === "s-oport") {
    A.oport.forEach(m => ev.push({ i: "💬", t: `${m.c.nome} · ${dia(m.dt)}`, d: `"${m.txt}" · potencial estimado de ${brl(m.valor || 0)}` }));
  }
  return ev;
}

    ${s ? `<button class="btn r sm" data-act="evid:${s.id}">Ver evidências do sinal</button>` : ""}`);

/* ================= CICLO: aprovar → executar → resultado ================= */
function rate(tipo){
  const all = [...HIST, ...ST.results.map(x => ({ tipo: x.tipo, res: x.res }))].filter(h => h.tipo === tipo);
  return all.length ? all.filter(h => h.res === "sucesso").length / all.length : 0;
}
function approve(id, el){
  const r = ST.recs.find(x => x.id === id); const card = el.closest(".rec");
  const done = () => { r.status = "aprovada"; r.aprovadaEm = Date.now(); save(); render(); toast("Aprovada. A ação ficou pronta em Ações, aguardando execução."); };
  if (card && !REDUCE) { card.classList.add("leaving"); setTimeout(done, 320); } else done();
}
function showReject(id, el){
  const box = el.closest(".rec").querySelector(".acts");
  box.innerHTML = `<div class="reject-box" style="width:100%"><label style="font-size:12px;font-weight:700" for="rj-${id}">Por que rejeitar? O MAE usa isso para aprender.</label>
    <select id="rj-${id}"><option>Já tratado por outro canal</option><option>Não faz sentido para este cliente</option><option>Momento errado</option><option>Evidência insuficiente</option><option>Outro motivo</option></select>
    <div style="display:flex;gap:8px"><button class="btn r sm" id="rjc-${id}">Cancelar</button><button class="btn p sm" id="rjo-${id}">Confirmar rejeição</button></div></div>`;
  document.getElementById("rjc-" + id).addEventListener("click", () => render());
  document.getElementById("rjo-" + id).addEventListener("click", () => {
    const r = ST.recs.find(x => x.id === id); r.status = "rejeitada"; r.motivo = document.getElementById("rj-" + id).value; save(); render(); toast("Rejeitada. Motivo registrado para o aprendizado.");
  });
}
function execute(id){ const r = ST.recs.find(x => x.id === id); r.status = "executada"; save(); render(); toast("Ação registrada como executada (simulado no protótipo)."); }
function recordResult(id, res){
  const r = ST.recs.find(x => x.id === id); r.status = "concluida"; r.res = res;
  ST.results.push({ id, tipo: r.tipo, t: r.t, res }); save(); render();
  toast(res === "sucesso" ? "Resultado registrado: deu certo. O Aprendizado foi atualizado." : "Resultado registrado. O Aprendizado foi atualizado.");
}

/* ================= COMPONENTES ================= */
function recCard(r, mode){
  const c = conf(r.n);
  let acts = "";
  if (mode === "pendente") acts = `<button class="btn g sm" data-act="approve:${r.id}">✓ Aprovar</button><button class="btn r sm" data-act="reject:${r.id}">Rejeitar</button><button class="btn ghost sm" data-act="rec:${r.id}">Detalhes</button>`;
  else if (mode === "aprovada") acts = `<button class="btn p sm" data-act="execute:${r.id}">▶ Executar ação</button><span style="font-size:11.5px;color:var(--muted)">nada é enviado sem este clique</span>`;
  else if (mode === "executada") acts = `<span style="font-size:12px;font-weight:700">Como terminou?</span><button class="btn g sm" data-act="result:${r.id}" data-res="sucesso">Deu certo</button><button class="btn r sm" data-act="result:${r.id}" data-res="recusou">Recusou</button><button class="btn r sm" data-act="result:${r.id}" data-res="sem resposta">Sem resposta</button>`;
  else if (mode === "rejeitada") acts = `<span class="tag">Motivo: ${esc(r.motivo || "—")}</span>`;
  return `<div class="rec reveal">
    <div class="rh"><span class="tag mae">${TIPO_LBL[r.tipo]}</span><span class="tag ${c.c}">Confiança ${c.l.toLowerCase()}</span></div>
    <div class="rt">${esc(r.t)}</div>
    <ul>${r.porque.slice(0, 3).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    <div class="meta"><span>Impacto <b>${brl(r.imp)}${r.tipo === "renovacao" ? "/ano" : r.tipo === "proposta" ? "" : "/mês"}</b></span><span>Funcionou em <b>${Math.round(rate(r.tipo) * 100)}%</b> das vezes</span></div>
    ${mode === "aprovada" ? `<div class="draft">${esc(r.msg)}</div>` : ""}
    <div class="acts">${acts}</div></div>`;
}
function sigRow(s){
  return `<button class="sig" data-act="evid:${s.id}"><span class="bar sev-${s.sev}"></span>
    <span><div class="st">${esc(s.t)}</div><div class="sd">${esc(s.d)}</div><div class="src-tag">${s.fontes.map(f => `<span>◦ ${esc(f)}</span>`).join("")}<span class="tag ${conf(s.n).c}" style="margin-left:2px">confiança ${conf(s.n).l.toLowerCase()}</span></div></span>
    <span class="go">evidências ›</span></button>`;
}

/* ================= VIEWS ================= */
function vVisao(){
  const h = new Date().getHours(), saud = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  const hero = SIGNALS[0], pend = recsBy("pendente");

function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function answer(q){
  const n = norm(q);
  const cli = CLIENTES.find(c => n.includes(norm(c.nome)) || norm(c.nome).split(" ").filter(w => w.length > 4).some(w => n.includes(w)));
  if (cli && /(fatur|compr|venda|quanto)/.test(n)) return { a: `Nos últimos 6 meses (abr–set) faturamos <b>${brlFull(sum(cli.rec))}</b> com ${esc(cli.nome)}. Em setembro foram ${brlFull(cli.rec[5])}, ${pct(cli.rec[5] / cli.rec[4] - 1, 0)} em relação a agosto.`,
    ev: MESES.map((m, i) => `${m}: ${brlFull(cli.rec[i])}`), src: ["Planilha de vendas"], link: `cliente:${cli.id}` };
  if (/(reduz|diminu|cair|caiu|queda)/.test(n) && /client/.test(n)) return { a: `${A.reduz.length} clientes reduziram compras de forma relevante (≥ 20%): ${A.reduz.map(x => `<b>${esc(x.c.nome)}</b> (${pct(x.var, 0)})`).join(", ")}. Juntos são <b>${brl(A.reduzPerda)}/mês</b> a menos.`,
    ev: A.reduz.map(x => `${x.c.nome}: média ${brl(x.base)} → ${brl(x.rec)}`), src: ["Planilha de vendas", "WhatsApp"], link: "go:clientes" };
  if (/fornecedor/.test(n) && /(preco|aument|reajust)/.test(n)) return { a: `${A.reajustes.filter(r => r.n).length} fornecedores reajustaram preços em 8 meses. O maior foi <b>${esc(A.reajMulti[0].f.nome)}</b>: ${A.reajMulti[0].n} reajustes, ${pct(A.reajMulti[0].alta, 0)} acumulado.`,
    ev: A.reajustes.filter(r => r.n).map(r => `${r.f.nome}: ${r.n} reajuste(s), ${pct(r.alta, 0)}`), src: ["Compras e fornecedores (sincronizado há 4 dias)"], link: "go:fornecedores" };
  if (/fatur|receita/.test(n)) { const neg = A.contrib.filter(x => x.v < 0), posv = sum(A.contrib.filter(x => x.v > 0).map(x => x.v));
    return { a: `O faturamento foi de ${brl(A.fatAnt)} em agosto para <b>${brl(A.fatAtual)}</b> em setembro (${pct(A.varMes)}). Os clientes que cresceram somaram ${brl(posv)}, puxados por ${A.top4.slice(0, 2).map(x => `<b>${esc(x.c.nome)}</b> (+${brl(x.v)})`).join(" e ")}. As quedas somaram ${brl(-sum(neg.map(x => x.v)))}, principalmente ${neg.sort((a, b) => a.v - b.v).slice(0, 2).map(x => `<b>${esc(x.c.nome)}</b> (${brl(x.v)})`).join(" e ")}.`,
      ev: A.contrib.slice(0, 4).concat(A.contrib.slice(-3)).map(x => `${x.c.nome}: ${x.v >= 0 ? "+" : ""}${brl(x.v)}`), src: ["Planilha de vendas"], link: "go:insights" }; }
  if (/contrato/.test(n)) return { a: `${A.contratos.length} contratos vencem nos próximos 30 dias: ${A.contratos.map(c => `<b>${esc(c.nome)}</b> em ${dia(c.contrato)}`).join(", ")}.`, ev: A.contratos.map(c => `${c.nome}: ${brl(c.rec[5] * 12)}/ano`), src: ["Cadastro de clientes"], link: "go:contratos" };
  if (/produto/.test(n)) return { a: `${A.prodQueda.length} produtos estão em queda: ${A.prodQueda.map(x => `<b>${esc(x.p.nome)}</b> (${pct(x.v, 0)})`).join(", ")}.${A.prodQueda[0].mencPreco ? ` No ${esc(A.prodQueda[0].p.nome)}, clientes citaram preço ${A.prodQueda[0].mencPreco} vezes.` : ""}`,
    ev: A.prodQueda.map(x => `${x.p.nome}: set ${num(x.p.qtd[5])} un. vs média ${num(avg(x.p.qtd.slice(2, 5)))}`), src: ["Planilha de vendas", "WhatsApp"], link: "go:produtos" };
  return null;
}
function ask(q){ ASKED = q; if (ROUTE !== "pergunte") { ROUTE = "pergunte"; try { history.replaceState(null, "", "#pergunte"); } catch (e) {} } closeDrawer(); render(); }
function vPergunte(){
  let ans = "";
  if (ASKED) { const r = answer(ASKED);
    ans = r ? `<div class="card answer reveal"><div class="q">${esc(ASKED)}</div><div class="a">${r.a}</div>
      <div><div class="sec-t">Evidências usadas</div>${r.ev.map(e => `<div class="ev"><div class="ei">▪</div><div><div class="ed" style="margin:0">${esc(e)}</div></div></div>`).join("")}</div>
      <div class="srcs">Fontes: ${r.src.map(s => `<span class="tag">${esc(s)}</span>`).join("")}<button class="btn ghost sm" data-act="${r.link}">abrir ›</button></div></div>`
      : `<div class="card answer reveal"><div class="q">${esc(ASKED)}</div><div class="a">Não encontrei dados suficientes para responder com segurança. No protótipo, o MAE responde perguntas sobre faturamento por cliente, clientes em queda, reajustes de fornecedores, contratos e produtos. No produto final, essa área usa o motor de perguntas do backend do MAE.</div></div>`; }
  return `<div class="head reveal"><div class="eyebrow">🧠 Pergunte à empresa</div><h1>O que você quer saber?</h1><p>O MAE responde a partir dos dados disponíveis e mostra as evidências. Se não houver dado suficiente, ele diz isso em vez de inventar.</p></div>
    <form class="ask-box reveal" id="ask-form"><input id="ask-in" placeholder="Ex.: quanto faturamos com o Hotel Vista Mar?" aria-label="Pergunta" value="${ASKED ? esc(ASKED) : ""}"><button class="btn p" type="submit">Perguntar</button></form>
    <div class="sugs reveal">${SUGS.map(q => `<button class="sug" data-act="ask:${encodeURIComponent(q)}">${esc(q)}</button>`).join("")}</div>${ans}`;
}

/* ================= RENDER ================= */
const VIEWS = { visao: vVisao, clientes: vClientes, fornecedores: vFornecedores, produtos: vProdutos, contratos: vContratos, conversas: vConversas, insights: vInsights, recomendacoes: vRecs, acoes: vAcoes, resultados: vResultados, aprendizado: vAprendizado, pergunte: vPergunte, dados: vDados };
function countUp(el, target, fmt, dur = 900){ if (!el) return; if (REDUCE) { el.textContent = fmt(target); return; } const t0 = performance.now();
  (function st(now){ const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3); el.textContent = fmt(target * e); if (t < 1) requestAnimationFrame(st); })(performance.now()); }
function render(){
  if (!VIEWS[ROUTE]) ROUTE = "visao";
  renderNav();
  const v = document.getElementById("view"); v.innerHTML = VIEWS[ROUTE](); wire(v);
  [...v.querySelectorAll(".reveal")].forEach((el, i) => { el.style.animationDelay = REDUCE ? "0ms" : (i * 60) + "ms"; el.classList.add("in"); });
  if (ROUTE === "visao") countUp(document.getElementById("hero-imp"), SIGNALS[0].imp, x => brl(x) + "/mês");
  if (ROUTE === "aprendizado") requestAnimationFrame(() => requestAnimationFrame(() => v.querySelectorAll(".lf").forEach(el => el.style.width = el.dataset.w + "%")));
  if (ROUTE === "clientes") document.getElementById("q-cli").addEventListener("input", e => { const q = norm(e.target.value); document.querySelectorAll("#cli-body tr").forEach(tr => tr.hidden = q && !norm(tr.dataset.s).includes(q)); });
  if (ROUTE === "conversas") document.querySelectorAll("#conv-f button").forEach(b => b.addEventListener("click", () => { document.querySelectorAll("#conv-f button").forEach(x => x.classList.toggle("on", x === b)); const t = b.dataset.t;
    document.querySelectorAll("#conv-list > div").forEach(el => el.hidden = t !== "todas" && !el.dataset.tags.split(",").includes(t)); }));
  if (ROUTE === "recomendacoes") document.querySelectorAll("#rec-tabs button").forEach(b => b.addEventListener("click", () => { REC_TAB = b.dataset.k; render(); }));
  if (ROUTE === "pergunte") document.getElementById("ask-form").addEventListener("submit", e => { e.preventDefault(); const q = document.getElementById("ask-in").value.trim(); if (q) ask(q); });
}
render();
</script>
